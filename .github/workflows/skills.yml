name: Skills

# The .skill files under dist/ are what people download. The source trees
# under skills/ are what people review and edit. If those two ever disagree,
# the library ships something nobody read, and the diff that would have caught
# it is invisible because a ZIP has no diff.
#
# This job is the thing that keeps that from happening quietly.

on:
  push:
    paths:
      - "skills/**"
      - "plugins/**"
      - "dist/**"
      - "tools/build_skills.py"
      - "install.py"
      - ".github/workflows/skills.yml"
  pull_request:
    paths:
      - "skills/**"
      - "plugins/**"
      - "dist/**"
      - "tools/build_skills.py"
      - "install.py"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Every skill declares a name and a description
        # A SKILL.md with no frontmatter is silently undiscoverable: Claude has
        # nothing to match a request against, so the skill simply never fires
        # and no error is ever raised. comp-package shipped that way.
        run: |
          python - <<'PY'
          import pathlib, sys
          sys.path.insert(0, "tools")
          from build_skills import read_frontmatter

          bad = []
          for base in ("skills", "plugins"):
              root = pathlib.Path(base)
              if not root.is_dir():
                  continue
              for d in sorted(p for p in root.iterdir() if p.is_dir()):
                  for smd in sorted(d.rglob("SKILL.md")):
                      fm = read_frontmatter(smd.read_text(encoding="utf-8", errors="replace"))
                      missing = [k for k in ("name", "description") if not fm.get(k)]
                      if missing:
                          bad.append(f"{smd.as_posix()}: missing {', '.join(missing)}")
                      if base == "skills" and smd.parent == d and fm.get("name") != d.name:
                          bad.append(f"{smd.as_posix()}: name {fm.get('name')!r} != directory {d.name!r}")
          for b in bad:
              print(f"::error::{b}")
          print(f"checked; {len(bad)} problem(s)")
          sys.exit(1 if bad else 0)
          PY

      - name: Distributed archives match their source trees
        run: python tools/build_skills.py --verify

      - name: Manifest is current
        run: |
          python tools/build_skills.py --manifest
          if ! git diff --quiet -- skills/manifest.json; then
            echo "::error::skills/manifest.json is stale. Run: python tools/build_skills.py --build --manifest"
            git --no-pager diff -- skills/manifest.json
            exit 1
          fi
          echo "manifest is current"

      - name: Installer resolves the catalog and installs cleanly
        # Exercises the real path a community member takes, against the local
        # checkout so the job does not depend on the commit already being
        # pushed. --dry-run alone would not catch an unpackable archive.
        run: |
          python install.py --list > /dev/null
          python install.py --dest /tmp/skills-ci --all
          python install.py --dest /tmp/skills-ci --all | tee /tmp/second.txt
          grep -q "installed\|updated" /tmp/second.txt && {
            echo "::error::second install was not a no-op; installer is not idempotent"; exit 1; }
          echo "installer OK, $(find /tmp/skills-ci -maxdepth 1 -mindepth 1 -type d | wc -l) packages"

      - name: Platform limits Claude Code enforces at install time
        # This is a user-facing gate. Breaking it does not fail here, it fails
        # on a community member's machine with "Plugin validation failed"
        # after they have already run the install command. Checked across
        # nested skills inside plugins too, which is where it broke.
        run: python tools/check_docs.py --ci

      - name: Doctor runs clean with no credentials at all
        # The first thing a new person runs. It must not need anything.
        run: |
          env -u DATASIFT_EMAIL -u DATASIFT_PASSWORD -u OPENWEBNINJA_API_KEY               -u TRESTLE_API_KEY python install.py --doctor > /tmp/doc.txt
          grep -q "Works right now" /tmp/doc.txt
          grep -q "Needs a credential" /tmp/doc.txt
          echo "doctor OK"

      - name: No credentials in anything we distribute
        run: |
          python - <<'PY'
          import pathlib, re, sys
          PAT = re.compile(
              r"(sk-ant-[A-Za-z0-9_-]{20,}|gh[pous]_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}"
              r"|apify_api_[A-Za-z0-9]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}"
              r"|eyJhbGciOi[A-Za-z0-9_.-]{30,}|-----BEGIN [A-Z ]*PRIVATE KEY)")
          hits = []
          for base in ("skills", "plugins"):
              for p in pathlib.Path(base).rglob("*"):
                  if not p.is_file() or p.stat().st_size > 4_000_000:
                      continue
                  t = p.read_text(encoding="utf-8", errors="ignore")
                  for m in PAT.finditer(t):
                      hits.append(f"{p.as_posix()}: {m.group(0)[:24]}...")
          for h in hits:
              print(f"::error::possible credential: {h}")
          print(f"scanned; {len(hits)} hit(s)")
          sys.exit(1 if hits else 0)
          PY
