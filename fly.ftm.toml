# fly.toml app configuration file generated for siftstack-ftm on 2026-08-14T12:52:51-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'siftstack-ftm'
primary_region = 'iad'

[build]
  dockerfile = 'deploy/Dockerfile.ftm'

[env]
  APIFY_PROXY_GROUPS = 'BUYPROXIES94952'
  APIFY_PROXY_SESSION = 'tnpn_fly'
  BUSINESS_TIMEZONE = 'America/New_York'
  # Live since 2026-08-16, after the 12-month backfill landed 1,226 records
  # clean. Without --commit the run scrapes and writes a CSV but never touches
  # DataSift, which is the right default only until a real run has been read.
  # `liens` (added 2026-11-11) pulls the Knox Register of Deeds and stages the
  # debtors that are new; it must stay BEFORE `county`, which uploads them and
  # only then marks them handled. It needs the PAXSUB_* secrets.
  # `sold` (added 2026-11-12) is the sold guard: it revives a lead that landed on an
  # old Sold record and marks real sales. It runs LAST, after the day's uploads.
  # `estate_ready` (added 2026-11-17) puts the tag "Obituary 30+ Days" on obituary
  # records whose death turned 30 days old, so the estate call presets show them.
  # `tax_sale` and `tax_delinquent` (added 2026-11-20, Ty: the county feeds go through the
  # Smarter Contact flow on the Top 1,000) scrape their own saved searches on their own
  # proxy session. Their records carry no FTM tag (datasift_formatter.NOT_FTM_TYPES); the
  # brain's top1000_feeds stage tags their lists Top 1000 at 07:35. The Blount searches
  # read zero rows on the site (dry runs 2026-11-20), and an empty search turns a feed red
  # every morning, so they are off below until Blount publishes there. `tax_sale_report`
  # (the Knox Trustee's own sale lists) stages rows for `county`, so it sits before it; it
  # stopped reading the site's forms as property lists the same day.
  FTM_ARGS = '--stages notices,tax_sale,tax_delinquent,capture,liens,tax_sale_report,county,estate_ready,sold --commit'
  FTM_SEARCH_BLOUNT_TAX_SALE = 'off'
  FTM_SEARCH_BLOUNT_TAX_DELINQUENT = 'off'
  FTM_JITTER_SECONDS = '600'
  # The daily coverage digest, posted whether the news is good or bad. 08:00 is
  # clear of the run: it starts 06:30 plus up to 600s jitter and the slowest run
  # in production took 26 minutes. Set to 'off' to disable.
  FTM_HEALTH_AT = '08:00'
  FTM_SCHEDULE = '06:30'
  FTM_SCHEDULE_DAYS = 'all'
  SIFTSTACK_LOG_DIR = '/data/logs'
  SIFTSTACK_OUTPUT_DIR = '/data/output'
  SIFTSTACK_STATE_DIR = '/data'

[[mounts]]
  source = 'ftm_data'
  destination = '/data'

[[vm]]
  # 2 shared cores and 2GB, not 1x/1gb. Chromium rendering ASP.NET postbacks is
  # CPU-bound: on shared-cpu-1x the browser took 60s just to launch and a
  # 12-month backfill would have run about twice as long as it needs to.
  size = 'shared-cpu-2x'
  memory = '2gb'
