    max_reads: 400

  bulk_native_trace:
    kind: native_trace
    owner: research
    lane: agency
    mode: "off"                   # retired 2026-11-13: Bulk records are the agency track now
    schedule: "every 60 min 08:00-18:00 Mon-Fri"
    presets: [Bulk - 00 Needs Skipped]
    tranche: true
    scoped: true
    min_age_hours: 1

  bulk_score:
    kind: score
    owner: research
    lane: agency
    mode: "off"                   # retired 2026-11-13: Bulk records are the agency track now
    schedule: "09:15 Mon-Fri"
    presets: [Bulk - 02 Ready to Call, Bulk - 03 Call Attempt 1, Bulk - 04 Call Attempt 2, Bulk - 05 Call Attempt 3, Bulk - 06 Call Attempt 4, Bulk - 07 Call Attempt 5]
    tranche: true
    drop_status: DEAD
    write_line_type: true
    max_records: 250
    recheck_days: 7

  bulk_dial_file:
    kind: dialexport
    owner: ops
    lane: agency
    mode: "off"                   # retired 2026-11-13: the calling agency dials these from the monthly file
    schedule: "Mon 07:50"
    summary: The current Bulk tranche as a weekly power-dialer file; each record is dialed about once a month to attempt 6.
    presets: [Bulk - 02 Ready to Call, Bulk - 03 Call Attempt 1, Bulk - 04 Call Attempt 2, Bulk - 05 Call Attempt 3, Bulk - 06 Call Attempt 4, Bulk - 07 Call Attempt 5]
    tranche: true
    every_days: 30
    power_dialer_over: 1000
    rest_after_days: 5
    max_reads: 400

  rehash_dial_file:
    kind: dialexport
    owner: ops
    mode: "plan"
    schedule: "1st 07:30"
    summary: Records that never answered, back in the power dialer every 90 days.
    presets: ["Rehash - Ready (never answered)"]
    gate_allow: [exhausted]       # a finished round is the point of a rehash; nothing else is lifted
    every_days: 90
    rest_after_days: 5
    max_reads: 400


  # ------------------------------------------------------------------ Phase 6: KPIs, alarms and measurement
  # Every number these stages judge against is in team/kpi.yaml (the KPI catalog); none is set here.
  # None of them contacts a homeowner. The only change to the account is deal_sources' closing fields.
  kpi_alarms:
    kind: alarms
    owner: ops
    mode: "plan"
    schedule: "19:25 Mon-Fri"
    summary: The day's numbers checked against the catalog's alarms; each one is said once, with what to check first and the list to move to.
    covers: [kpi]
    ready_lists:
      - {lane: ftm, preset: FTM - 02 Ready to Call}
      - {lane: top1000, preset: Priority - 02 Ready to Call}
    trace_check:
      label: first-to-market records
      scope_tags: [FTM]
      waiting_preset: FTM - 00 Needs Skipped
      no_number_preset: FTM - 01 Skipped No Numbers
    stale_days: 4

  goal_sheet:
    kind: goals
    owner: ops
    mode: "plan"
    schedule: "Mon 07:40"
    summary: The revenue goal worked back to deals, leads, conversations and dials, each marked behind, at risk or on track, with a quarterly owner review on top.
    covers: [kpi]
    # Plan 6.4. Dials, conversations and leads are judged on 30 days, contracts and deals on 90, each
    # caller on 90. The revenue goal and the average deal in team/kpi.yaml are placeholders until set.
    closed_statuses: [closed]
    contract_statuses: [under_contract]
    owner_review: quarterly        # quarterly | always | off
    max_record_reads: 40           # records opened a run to credit a new lead to its caller

  deal_sources:
    kind: dealsource
    owner: ops
    mode: "plan"
    schedule: "03:10 daily"        # the night list
    summary: Each closed deal recorded with its lane, list, channel, days from first touch and three names; each month, deals by source and cost per deal.
    # Plan 6.5. The deal rows are the autopilot's own record. Live, it also fills seven custom fields
    # on the record, each only when empty: create them first (text fields), the stage names any missing.
    closed_statuses: [closed]
    contract_statuses: [under_contract]
    researched_tags: [Deep Prospected]
    list_order: [Foreclosure, Probate, Tax Sale, Tax Delinquent, Liens, Condemned, Code Violation, Eviction, Divorce, Obituary]
    write_fields: true
    fields:
      lane: Deal Lane
      list: Deal List
      channel: Deal Channel
      days: Days From First Touch
      generated_by: Lead Generated By
      carried_by: Lead Carried By
      closed_by: Deal Closed By
    fee_field: ""                  # the custom field holding what a deal paid, for the margin in the owner review
    mail_tracking_lines: {}        # "8655550140": handwritten_letter, or "" for a line every piece shares
    max_records: 25                # closings read a run
    max_lead_reads: 60             # records opened for the monthly table, to place a lead's channel

  cadence_tuner:
    kind: cadence
    owner: ops
    mode: "plan"
    schedule: "1st 03:40"          # monthly, on the night list
    summary: Every sold record's last conversation set against its sale date; proposes follow-up intervals 15 days shorter where leads are being lost. It never edits anything.
    # Plan 6.6. A proposal only: the intervals in team/kpi.yaml and in DataSift are yours to change.
    sold_statuses: [sold]
    days: 120                      # sale dates this far back (the sale date lags a closing by weeks)
    auction_marks: [Foreclosure, Auction Soon]
    priority_marks: [Probate]
    max_records: 150               # sold records opened a run; one already studied is not opened again

  coaching_picks:
    kind: coachpick
    owner: ops
    mode: "plan"
    schedule: "19:30 Mon-Fri"      # after the capture; weekly picks on weekly_on, a new hire's every day
    summary: The two best and two worst calls of each caller picked from the call log and queued for call coaching, daily in a new hire's first week.
    covers: [callpull]
    # Plan 6.7. It picks, it does not grade. Notes go to the owner first.
    weekly_on: Fri
    new_hires: {}                  # Name: "YYYY-MM-DD", the caller's first day
    workflow: call_coaching
    agent: ops
    outcome_hours: 24

  research_results:
    kind: researchstats
    owner: ops
    mode: "plan"
    schedule: "1st 03:50"          # monthly, on the night list
    summary: Each researched record read 30 days on, was a decision maker reached, by which number, did it become a lead, against the teaching's 50 to 70 percent.
    # Plan 3.11.
    researched_tags: [Deep Prospected]
    closed_statuses: [closed]
    max_records: 60                # researched records opened a run; each is read once

  # ------------------------------------------------------------------ The research lane (plan 3.1, 3.2, 3.5 to 3.8, 3.10)
  research_queue:
    kind: researchqueue
    owner: research
    mode: "plan"
    schedule: "every 30 min 08:00-17:00 Mon-Fri"
    summary: Research works one ranked queue inside its daily budget; each record gets the tag Research Queued and one card.
    # When this goes live, switch ftm_deep_prospect, ftm_return_mail and ftm_no_numbers off, so the
    # queue is the one door into research.
    presets: ["02 Obituary / Deceased", "03 Exhausted Call -> DP", "03b No Live Number -> DP", "04 Return Mail -> DP", "05 Vacant -> DP", "01 No / Bad Phone"]
    hints: {"03 Exhausted Call -> DP": exhausted, "03b No Live Number -> DP": no_number, "04 Return Mail -> DP": returned_mail, "05 Vacant -> DP": vacant_mailing, "01 No / Bad Phone": no_number}
    scope_tags: [Auction Soon]
    scope_lists: [Probate, Condemned]
    statuses: [Deep Prospecting]
    return_signals: true
    research_by_list: {Condemned: arrival, Foreclosure: arrival, Probate: arrival, Liens: exhausted}   # plan 1.17
    workflow: deep_prospect
    agent: research
    rate_usd: 1.21
    daily_usd: 25
    max_open: 2                   # one worker runs every task: five 8-minute research runs would hold the clock 40 minutes
    card_column: {title: Check Relatives, uuid: ""}    # the column uuid; no published route lists columns
    card_done_column: ""                                # uuid of the done column; empty leaves the card

  heir_lane:
    kind: heirlane
    owner: ops
    mode: "plan"
    schedule: "09:15 Mon-Fri"
    summary: Researched records worked one verified heir at a time by one caller, texted by name about the property, written to at the heir's own address.
    gate_allow: [heir, in_research]
    heir_caller: null        # D19
    attempts_per_heir: 5
    letters_per_heir: 4
    text_system: smarter_contact
    daily_pieces: 30
    daily_texts: 30

  obituary_lane:
    kind: obituary
    owner: research
    mode: "plan"
    schedule: "09:40 Mon-Fri"
    summary: Obituary records held a month, one soft letter before month three, researched at three months, mailed monthly until then, matched against probate filings.
    covers: [obitcamp, obitmail]   # the org-chart agents whose job this stage does (obituary_mail retired 2026-11-13)
    presets: ["Obituary - All"]
    gate_allow: [deceased]
    call_presets: ["06 Obituary - Ready to Call", "07 Obituary - Call Attempt 1", "08 Obituary - Call Attempt 2", "09 Obituary - Call Attempt 3"]
    calls: after_research

  probate_honest:
    kind: probate
    owner: analysis
    mode: "plan"
    schedule: "Mon 07:40"
    summary: Probate kept honest as a list a person approves, flagged addresses by the measured split, old probates to mail only, a no called again at 45 days.
    recall: auto

  paid_lookups:
    kind: paidlookup
    owner: ops
    mode: "plan"
    schedule: "09:05 Mon-Fri"
    summary: Records every source missed and worth the money queued for the assistant's paid people search, with a weekly task.
    presets: ["01 No / Bad Phone", "03b No Live Number -> DP"]
    assistant: null          # D37

  # ------------------------------------------------------------------ The two tracks (the owner's decision, 2026-11-13)
  # Priority: first to market plus the Top 1,000, worked in-house by the stages above (lanes: [ftm,
  # top1000]). Agency: everything else in the buy box, sent once a month to the calling agency.
  # Both rank by the Dream 100 opportunity score (src/dream100_build.py), one owner one slot, from
  # one shared SiftMap sweep a month (search only, never a detail read). Neither writes in plan mode.
  # First population on purpose, without taking the stage live:
  #   python -m agents.autopilot.top1000 plan          (from src/)
  #   TOP1000_ALLOW=1 python -m agents.autopilot.top1000 apply --commit
  top1000_refresh:
    kind: top1000
    owner: analysis
    lane: top1000
    mode: "plan"
    schedule: ["1st 00:20", "1st 03:20", "2nd 00:20", "3rd 00:20"]   # monthly; the later slots only finish what the first could not
    summary: The Top 1,000 owners re-ranked once a month by the Dream 100 score, one owner one slot; who would gain and lose the tag is listed, with the ranking as a file.
    # The pool: the agency track's own rows (owner and status of each house), plus the records that
    # hold the tag now and the records on the Agency list, so a house sent last month can still be
    # promoted. If the parallel preset build splits the queue in two, list both titles here.
    presets: [Agency - 01 Queue]
    pool_lists: [Agency]
    counties:
      - {fips: "47093", name: Knox, state: TN}
      - {fips: "47009", name: Blount, state: TN}
    size: 1000                    # owners, not houses: a selected owner gets the tag on every house in the buy box
    tag: Top 1000
    finalists: 1.5                # 1,500 owners read in full for their phones (reach) and the full gate
    keep_in_round: true           # a holder that falls out keeps the tag until its round ends
    exclude_lists: [Obituary]     # the obituary lane and its research have these owners; the Priority presets do not exclude them
    weights: today                # the Dream 100 weight set (D31): today or taught
    read_fields: false            # the gate's custom-field read is one more request per finalist; the in-house stages read it when they act
    max_reads: 1500               # records opened a run (remembered facts_days, so a stopped run continues)
    max_writes: 2500              # tag changes a run
    max_searches: 900             # SiftMap searches a run (its own request counter), 100 rows each
    page_size: 100                # SiftMap's fair use asks for pages of 25 to 100
    facts_days: 5
    d4d_cohort: ""                # the D4D cohort file on the box; empty looks in DATA_DIR/d4d/cohort.json

  agency_export:
    kind: agencyexport
    owner: ops
    lane: agency
    mode: "plan"
    schedule: "every 60 min 00:00-05:00 daily"   # the month's file from the 1st once the Top 1,000 is done; other nights only mark a sent file
    summary: The month's file for the calling agency, the top 5,000 owners not sent in 90 days in the format the agency already maps, staged for a person to send.
    presets: [Agency - 01 Queue]  # the agency track; if the parallel preset build splits it in two, list both titles here
    counties:
      - {fips: "47093", name: Knox, state: TN}
      - {fips: "47009", name: Blount, state: TN}
    size: 5000                    # owners in the file
    resend_days: 90               # an owner is not sent again sooner than this (enforced here: a preset cannot filter the date field)
    exclude_lists: [Obituary]     # owners the obituary lane works are not sent to the agency
    margin: 0.10                  # owners read past the size, so the file fills after the ones the agency cannot dial
    list: Agency                  # a sent record goes on this list
    field: Sent to Agency         # and this custom date field is set to the day the file was sent
    list_name: Agency call list   # the file's name and its Read me title
    about: "The agency track: owners in the buy box who are not first to market and not in the Top 1,000, highest Dream 100 score first."
    after_stage: top1000_refresh  # the file waits for this month's Top 1,000
    read_fields: false
    max_reads: 2500               # records opened a run (every house of a candidate owner, remembered facts_days)
    max_writes: 1200              # records marked a run from a sent file (two writes each)
    release_writes: 100           # records marked inside the release itself; the night runs mark the rest
    release_reads: 400            # records read again at release (only the ones whose log changed since staging)
    max_field_reads: 300          # Agency-list records with no send date the autopilot knows, read a run
    plan_harvest: true            # a plan reads the records too, so the file can be looked at before going live
    registry_numbers: hold        # decision D32: a number seen flagged from the do-not-call registry stays out of the file (mail only); send = keep it
    max_searches: 900
    page_size: 100
    facts_days: 5
