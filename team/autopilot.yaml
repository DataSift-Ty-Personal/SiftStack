  ftm_deep_prospect:
    kind: handoff
    owner: research
    lane: ftm
    mode: "off"
    schedule: "13:00 Mon-Fri"
    summary: First-to-market records whose owner has died go to Diggs for the full heir and signer research, two a day.
    # Challenge C12.1, C11.9: no marketing before month 3; deep prospect once the last obituary date is 3+ months old.
    # The preset's own window (last_obituary_date 24 months back to 3 months back) already holds that rule.
    presets: ["02 Obituary / Deceased"]
    require_tags: [FTM]
    workflow: deep_prospect
    agent: research
    per_day: 2

  # Lesson 4-05 @ 26:09 and 5-01: deep prospect a record when its mail comes back, and when it has
  # no number after every trace (it has already moved to mail only, so it is still being mailed).
  ftm_return_mail:
    kind: handoff
    owner: research
    lane: ftm
    mode: "off"
    schedule: "13:15 Mon-Fri"
    summary: First-to-market records whose mail came back go to Diggs, one a day.
    presets: ["04 Return Mail -> DP"]
    require_tags: [FTM]
    workflow: deep_prospect
    agent: research
    per_day: 1
    # Plan 1.7: a return is read three ways (the status, a return tag, the do-not-mail flag), and a
    # return is told apart from an opt-out by a tag written the day it is first seen.
    return_signals: {statuses: [Return Mail], tags: [Return Mail, Returned Mail], flag: true}
    return_tag: Return Mail
    opt_out_tags: [Mail Opt Out, Do Not Mail]
    returns_scan: {weekday: mon}     # D37: add assignee: <first name> for the weekly returned-letters task

  ftm_no_numbers:
    kind: handoff
    owner: research
    lane: ftm
    mode: "off"
    schedule: "13:30 Mon-Fri"
    summary: First-to-market records still without a number after every trace go to Diggs, one a day.
    presets: ["01 No / Bad Phone"]
    require_tags: [FTM, Mail Only]
    workflow: deep_prospect
    agent: research
    per_day: 1

  # ------------------------------------------------------------------ Quinn, Operations
  ftm_mail:
    kind: mail
    owner: ops
    lane: ftm
    pipeline: ftm_pipeline             # on the live board the mail waits for Exhausted, unless the timeline mails at once (a foreclosure)
    mode: "plan"                       # held until the new mailers come out (Ty, 2026-11-19); still in AGENTS_LIVE_STAGES, so "live" is the only switch
    schedule: "10:00 Mon-Fri"
    summary: Foreclosures past their weekly auction run, mailed a month apart through DataSift's own mail, staged for a person to release.
    vendor: siftmail
    internal_routes: true
    min_batch: 1                  # Ty, 2026-11-16: SiftMail takes any count
    send: staged
    daily_pieces: 50
    daily_usd: 60
    wait_days: 30
    offer_pct: 0
    # The evergreen sequence (Ty, 2026-11-16: everything mailed outside the auction and estate pipelines runs one
    # sequence; top1000_mail carries the same six). The preset titles still name the old three-piece mix: a preset
    # only counts mail attempts, so the piece is set here. A piece with design_noname goes out named only where
    # SiftMail would print a clean first name (mail.is_named); everyone else gets the "Hi there," / "Hello," twin.
    # THREE FORMATS ONLY (Ty, 2026-11-20, on Open Letter's advice): the 6x9 postcard (14), the Real Penned
    # handwritten letter (16) and the Snap Pack (18, a pressure-sealed check-style mailer, First-Class, live in
    # DataSift since 2026-11-20 at $1.15). No professional letters (1, 3) and no personal letters (5); the
    # selftest refuses any other product on a mail piece. Step 3 is the Snap Pack check with no amount, step 6 the
    # comparison as a Snap Pack letter. Designs and filled proofs: output/siftmail (proofs/snap_2026-11-20).
    prices: {family_postcard: 0.74, postcard: 0.74, snap_pack: 1.15}
    pieces:
      - {preset: FTM - Mail 01 Handwritten Letter, piece: handwritten_letter, product_id: 16, envelope: 16, design: "00000000-0000-0000-0000-000000000000", external_identifier: "", design_noname: "00000000-0000-0000-0000-000000000000", external_identifier_noname: ""}   # EVG T1, lavender envelope
      - {preset: FTM - Mail 02 Family Postcard, piece: family_postcard, product_id: 14, design: "00000000-0000-0000-0000-000000000000", external_identifier: "", street_view: true}   # EVG T2 Doodle Streetview
      - {preset: FTM - Mail 03 Soft-Offer Check, piece: snap_pack, product_id: 18, design: "00000000-0000-0000-0000-000000000000", external_identifier: "", design_noname: "00000000-0000-0000-0000-000000000000", external_identifier_noname: ""}   # SNP Live check v6: the live-check style formatted like Rich's example, the check at the bottom behind the window (2026-11-21), no amount
      - {preset: FTM - Mail 04 Handwritten Letter, piece: postcard, product_id: 14, design: "00000000-0000-0000-0000-000000000000", external_identifier: "", street_view: true}   # EVG T4 stick-figure card
      - {preset: FTM - Mail 05 Family Postcard, piece: handwritten_letter, product_id: 16, envelope: 17, design: "00000000-0000-0000-0000-000000000000", external_identifier: "", design_noname: "00000000-0000-0000-0000-000000000000", external_identifier_noname: ""}   # EVG T5 follow-up note, navy envelope
      - {preset: FTM - Mail 06 Soft-Offer Check, piece: snap_pack, product_id: 18, design: "00000000-0000-0000-0000-000000000000", external_identifier: ""}   # EVG T6 Snap comparison: selling to us or listing it
    sender: {}

  top1000_mail:
    kind: mail
    owner: ops
    lane: top1000
    mode: "off"                     # Ty, 2026-11-20: the new mailers go to first to market only (decision D33)
    schedule: "10:30 Mon-Fri"
    summary: The Top 1,000 mail lane, six pieces a month apart through DataSift's own mail, staged for a person to release.
    vendor: siftmail
    internal_routes: true
    min_batch: 1                  # Ty, 2026-11-16: SiftMail takes any count
    send: staged
    daily_pieces: 50
    daily_usd: 60
    wait_days: 30
    offer_pct: 0
    # the same six evergreen pieces as ftm_mail (one sequence, Ty 2026-11-16), on the three formats of 2026-11-20
    prices: {family_postcard: 0.74, postcard: 0.74, snap_pack: 1.15}
    pieces:
      - {preset: Priority - Mail 01 Handwritten Letter, piece: handwritten_letter, product_id: 16, envelope: 16, design: "00000000-0000-0000-0000-000000000000", external_identifier: "", design_noname: "00000000-0000-0000-0000-000000000000", external_identifier_noname: ""}   # EVG T1
      - {preset: Priority - Mail 02 Family Postcard, piece: family_postcard, product_id: 14, design: "00000000-0000-0000-0000-000000000000", external_identifier: "", street_view: true}   # EVG T2
      - {preset: Priority - Mail 03 Soft-Offer Check, piece: snap_pack, product_id: 18, design: "00000000-0000-0000-0000-000000000000", external_identifier: "", design_noname: "00000000-0000-0000-0000-000000000000", external_identifier_noname: ""}   # SNP Live check v6
      - {preset: Priority - Mail 04 Handwritten Letter, piece: postcard, product_id: 14, design: "00000000-0000-0000-0000-000000000000", external_identifier: "", street_view: true}   # EVG T4
      - {preset: Priority - Mail 05 Family Postcard, piece: handwritten_letter, product_id: 16, envelope: 17, design: "00000000-0000-0000-0000-000000000000", external_identifier: "", design_noname: "00000000-0000-0000-0000-000000000000", external_identifier_noname: ""}   # EVG T5
      - {preset: Priority - Mail 06 Soft-Offer Check, piece: snap_pack, product_id: 18, design: "00000000-0000-0000-0000-000000000000", external_identifier: ""}   # EVG T6 Snap comparison
    sender: {}

  # ------------------------------------------------------------------ retired lanes: Priority 1 (Hottest), Strong, Bulk
  # Off since 2026-11-13: the marketing became two tracks. Priority 1, Priority 2 and Bulk records
  # are the agency track now (or the Top 1,000 when they score into it), and the calling agency
  # works them from the monthly file, so nothing in-house dials them. The code stays.
