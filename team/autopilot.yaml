# The autopilot playbook: the prospecting half of the business, run stage by stage.
#
# The account already describes the lifecycle as saved presets (since 2026-11-17 three flows:
# 01-03 FORECLOSURE, 04-06 ESTATES, 07-09 TOP 1000, then 10 AGENCY, 11 DEEP PROSPECTING and 12
# REACTIVATION; the hot auction list sits in 02 FORECLOSURE - CALL). Each stage below names the
# presets that hold its records, by exact title, and does the one move a person used to make by
# hand. The presets are read live every run, so editing one in DataSift changes what the stage does.
#
# mode:
#   off   never runs
#   plan  runs on its schedule, works out exactly what it would do and cost, posts that, writes nothing
#   live  acts inside its caps, and only on a box running AGENTS_MODE=live
# Every stage ships in plan. Flip one at a time once its plan reads right.
#
# Check this file:  python src/agents/cli.py autopilot check
# See every plan:   python src/agents/cli.py autopilot plan

business:
  tz: America/New_York
  hours: "09:00-18:00"      # outreach never goes out outside these hours
  days: [Mon, Tue, Wed, Thu, Fri]

caps:
  daily_usd: 25             # data spend in one day (skip traces, phone scoring), all stages together
  outreach_daily_usd: 60    # mail spend in one day, its own budget: at $1.89 a handwritten letter, about 31 a day
  record_usd: 1.00          # lifetime trace and scoring spend on one record before it stops being traced

people:
  # Who new records go to, by DataSift first name. Inactive users are skipped and said so.
  # prod-account on 2026-11-11: Emerson is active (lead manager); Sloane is inactive.
  callers: []                     # first names of the active callers in your account

# The suppression gate (src/agents/autopilot/gate.py): the one check before any assignment, call,
# text, mail piece, trace or research handoff, run when a record is picked up and again when a
# staged batch is released. These are the tags, lists and fields it reads in THIS account; the
# defaults are shown, so delete a line to keep the default. Nothing lifts Do Not Market, a
# litigator, an opt-out or a sold house.
gate:
  do_not_market_tags: [Do Not Market]     # the texting agent's opt-out tag
  litigator_tags: [Litigator]             # written by the scoring stage on the record AND the owner's other records
  suppress_lists: [DNC]                   # Smarter Contact's "stop" lands on this list
  deceased_tags: [deceased, Verify Deceased]
  deceased_lists: [Obituary]              # an obituary on a record: hold for research (it is often a spouse's)
  deceased_fields: [Owner Deceased]
  probate_marks: [Probate]                # a probate record's owner is the court's representative, so the list does not hold it
  heir_tags: [Heir Identified]
  sold_tags: [recently sold, Sold, Estate Sold]   # Estate Sold (the probate stage's tag) was missing here, so it held nothing (2026-11-20)
  mail_only_tags: [Mail Only]
  not_sfr_tags: [Not Single Family]
  # Tags that hold a record for research like the Deep Prospecting status: no stage assigns, calls, texts,
  # mails, traces or scores it; research may take it. Tax Sale Redemption (2026-11-20): a former owner who
  # can still redeem a tax sale house is held from every outreach until a lawyer okays it, which is a
  # person taking the tag off (or this line). Only a person's booked visit lifts it (allow word research_tag).
  research_tags: [Tax Sale Redemption]
  read_fields: true                       # also read the Owner Deceased custom field (one more read per record acted on, cached a week)
  # The national do-not-call registry flag DataSift puts on skip-traced numbers. OFF for this account
  # (Ty, 2026-11-17: "we don't need it for our case"): a flagged number is texted and called like any
  # other, and the agency file keeps it. true turns the whole rule back on (decision D32: never texted,
  # held from calls; switch the two *_registry_scrub stages on with it for the daily count). Opt-outs
  # are not this switch and always hold: the DNC list, Do Not Market, a phone a person marked DNC.
  registry_flag: false

# Lanes (src/agents/autopilot/lanes.py). An owner sits in ONE lane across all of their records:
# lead > heirs > hot_auction > ftm > obituary > top1000 > agency. The highest wins and the owner's
# other records are held. Each lane with a timeline is worked on that timeline only, so no two
# stages can disagree about what happens after the call round (decisions D1, D3, D6).
#
# TWO TRACKS (the owner's decision, 2026-11-13). Priority: every first-to-market record (FTM) plus
# the Top 1,000 owners (tag Top 1000, kept by top1000_refresh), worked in-house through the whole
# sequence, first to market on top. Agency: everything else in the buy box, sent once a month to
# the calling agency (agency_export). The Priority 1 and Priority 2 tags no longer decide a lane.
lanes:
  heirs:       {tags: [Heir Identified]}
  hot_auction:
    tags: [Auction Soon]
    timeline: true            # the FTM round, then a call task every 2 days to the sale, a door knock inside 7 days (1.8, 4.8)
  ftm:
    tags: [FTM]
    timeline:
      round_ends_at: 5            # five full call attempts end the round (D1)
      opening_texts: [0, 1, 2]    # business days for texts 1, 2 and 3 (D3)
      call_days: [1, 2, 3, 4, 5]
      mail_first_day: 8           # mail starts when the round ends (D6)
      mail_every_days: 30
      mail_pieces: 12             # twelve monthly pieces on first-to-market records (D7)
      mail_at_once: [no_number, foreclosure]   # no usable number, or a sale a median 34 days out
      followup_texts: {first_day: 8, last_day: 18, count: 4}
  obituary:    {tags: [Obituary], lists: [Obituary]}
  top1000:
    tags: [Top 1000]
    timeline: true            # texts days 0-2, calls days 1-5, mail when the round ends, 6 pieces, research at exhaustion (D3, D7); no foreclosure rules
  agency:
    timeline: true            # worked by the calling agency: nothing is texted, called or mailed from here

stages:

  # ------------------------------------------------------------------ Phase 0: safe before anything goes live
  # Every stage below reads, checks or corrects. None of them contacts a homeowner.
  ftm_pipeline:
    kind: ftmpipeline
    owner: ops
    mode: "live"
    schedule: ["02:50 Mon-Fri", "08:35 Mon-Fri", "17:00 Mon-Fri"]   # the night and the morning judge the days that are over; 5pm says who is short today
    summary: Every county record on the First to Market board, Research, Day 1 to Day 5, Exhausted, one column a business day and only after that day's call and text.
    # Three pipelines (2026-11-14): county records on this board, the Top 1,000 on its own presets,
    # the agency outside. A probate or obituary record waits in Research for a decision maker with a
    # number; a record whose owner is known starts at Day 1. A day without its full attempt holds the
    # card. Any lead status takes the card off the board. The board and its columns were made in prod-account
    # on 2026-11-14 by the account tool (python src/agents/autopilot/pipelines.py apply); a new board
    # has no card to learn its columns from, so their ids are named here.
    board: First to Market
    column_ids:
      Research: 00000000-0000-0000-0000-000000000000
      Day 1: 00000000-0000-0000-0000-000000000000
      Day 2: 00000000-0000-0000-0000-000000000000
      Day 3: 00000000-0000-0000-0000-000000000000
      Day 4: 00000000-0000-0000-0000-000000000000
      Day 5: 00000000-0000-0000-0000-000000000000
      Exhausted: 00000000-0000-0000-0000-000000000000
    presets:
      - FTM - 00 Needs Skipped
      - FTM - 01 Skipped No Numbers
      - FTM - 02 Ready to Call
      - FTM - 03 Call Attempt 1
      - FTM - 04 Call Attempt 2
      - FTM - 05 Call Attempt 3
      - FTM - 06 Call Attempt 4
      - Estate - 00 Needs Skipped
      - Estate - 01 Skipped No Numbers
      - Estate - 02 Ready to Call
      - Estate - 03 Call Attempt 1
      - Estate - 04 Call Attempt 2
      - Estate - 05 Call Attempt 3
      - Estate - 06 Call Attempt 4
    obituary_presets: [Obituary - All]       # a preset cannot say "tag FTM or list Obituary": this is the board's second door
    research_first: [Probate, Obituary]
    researched_tags: [Deep Prospected, Heir Identified, Heirs Resolved]
    dm_fields: [Decision Maker]
    off_board_tags: [Wrong House]
    text_days: [1, 2, 3]            # the opening texts; add 4 and 5 once the afternoon text is live (full_attempt)
    require_text: auto              # the text half counts only while ftm_texts acts on this box (live, or named in AGENTS_LIVE_STAGES on a free box)
    text_stage: ftm_texts
    call_alone_lanes: [hot_auction] # a sale inside the window moves on its call alone, as that lane always counted it
    lead_column: ""                 # a lead's card leaves the board; the lead board owns it
    backlog: counter                # a record called before the board went live starts where its counter says
    max_reads: 200
    night_reads: 400
    max_creates: 200
    max_moves: 300

  ftm_death_screen:
    kind: screen
    owner: research
    mode: "live"   # first live wave 2026-11-17: zero spend, no homeowner contact; acts only on a live process
    schedule: "every 30 min 07:00-19:00 daily"    # ahead of assign and the first text
    summary: New first-to-market records checked for a death before any text or assignment, and held for research when one may have happened.
    lane: ftm
    # Every preset ftm_texts reads is here too (2026-11-18): the text stage texts only a record this
    # screen has marked (require_screen), and the probate and estate presets were left out because the
    # screen skips a probate's owner anyway, which meant no new probate would ever have been texted. A
    # probate costs one read here: it is marked screened, never looked up.
    presets:
      - FTM - 00 Needs Skipped
      - FTM - 01 Skipped No Numbers
      - FTM - 01 Ready to Text
      - FTM - 02 Texted, Not Yet Called
      - FTM - 02 Ready to Call
      - FTM - 03 Call Attempt 1
      - FTM - 04 Call Attempt 2
      - FTM - 05 Call Attempt 3
      - FTM - 06 Call Attempt 4
      - FTM - Hot Auction (sale in 45 days)
      - Probate - 01 Ready to Text
      - Probate - 02 Texted, Not Yet Called
      - Estate - 02 Ready to Call
      - Estate - 03 Call Attempt 1
      - Estate - 04 Call Attempt 2
      - Estate - 05 Call Attempt 3
      - Estate - 06 Call Attempt 4
    tag: Verify Deceased
    index_counties: [knox]
    years: 3
    on_hit: tag
    max_records: 60

  top1000_death_screen:
    kind: screen
    owner: research
    mode: "live"     # 2026-11-18 with the Top 1,000 texts (Ty: "the top 1,000 that we haven't texted ... to get those rolling")
    schedule: "every 30 min 07:15-19:15 daily"
    summary: New Top 1,000 records checked for a death before any text or assignment, and held for research when one may have happened.
    lane: top1000
    presets:              # every preset top1000_texts reads, which waits on this screen
      - Priority - 00 Needs Skipped
      - Priority - 01 Skipped No Numbers
      - Priority - 01 Ready to Text
      - Priority - 02 Texted, Not Yet Called
      - Priority - 02 Ready to Call
      - Priority - 03 Call Attempt 1
      - Priority - 04 Call Attempt 2
    tag: Verify Deceased
    index_counties: [knox]
    years: 3
    on_hit: tag
    max_records: 60

  ftm_attempts:
    kind: attempts
    owner: ops
    mode: "live"   # first live wave 2026-11-17: zero spend, no homeowner contact; acts only on a live process
    schedule: "every 60 min 09:00-19:00 Mon-Fri"
    summary: The call counter of every first-to-market record written from the call log, and on the live board from the board's full attempts.
    # On the live First to Market board a day counts once it is a full attempt, so the counter is the
    # board's count and every preset keyed on it shows what the board shows (ftmpipeline).
    lane: ftm
    pipeline: ftm_pipeline
    presets:
      - FTM - 01 Ready to Text
      - FTM - 02 Texted, Not Yet Called
      - FTM - 02 Ready to Call
      - FTM - 03 Call Attempt 1
      - FTM - 04 Call Attempt 2
      - FTM - 05 Call Attempt 3
      - FTM - 06 Call Attempt 4
      - Probate - 01 Ready to Text
      - Probate - 02 Texted, Not Yet Called
      - Estate - 02 Ready to Call
      - Estate - 03 Call Attempt 1
      - Estate - 04 Call Attempt 2
      - Estate - 05 Call Attempt 3
      - Estate - 06 Call Attempt 4
    counters:
      "FTM - 01 Ready to Text": 0
      "FTM - 02 Texted, Not Yet Called": 0
      "FTM - 02 Ready to Call": 0
      "FTM - 03 Call Attempt 1": 1
      "FTM - 04 Call Attempt 2": 2
      "FTM - 05 Call Attempt 3": 3
      "FTM - 06 Call Attempt 4": 4
      "Probate - 01 Ready to Text": 0
      "Probate - 02 Texted, Not Yet Called": 0
      "Estate - 02 Ready to Call": 0
      "Estate - 03 Call Attempt 1": 1
      "Estate - 04 Call Attempt 2": 2
      "Estate - 05 Call Attempt 3": 3
      "Estate - 06 Call Attempt 4": 4
    floor_days: 45
    first_run: staged

  top1000_attempts:
    kind: attempts
    owner: ops
    mode: "live"
    schedule: "every 60 min 09:30-19:30 Mon-Fri"
    summary: The call counter of every Top 1,000 record written from the account's own call log, whichever dialer made the call.
    lane: top1000
    presets:
      - Priority - 01 Ready to Text
      - Priority - 02 Texted, Not Yet Called
      - Priority - 02 Ready to Call
      - Priority - 03 Call Attempt 1
      - Priority - 04 Call Attempt 2
      - Priority - 05 Call Attempt 3
      - Priority - 06 Call Attempt 4
    counters:
      "Priority - 01 Ready to Text": 0
      "Priority - 02 Texted, Not Yet Called": 0
      "Priority - 02 Ready to Call": 0
      "Priority - 03 Call Attempt 1": 1
      "Priority - 04 Call Attempt 2": 2
      "Priority - 05 Call Attempt 3": 3
      "Priority - 06 Call Attempt 4": 4
    floor_days: 45
    first_run: staged

  owner_lanes:
    kind: lanes
    owner: ops
    mode: "live"
    schedule: "02:30 daily"     # the night list: a long scan, off the daytime request budget
    summary: Each owner placed in one lane across all of their records; an owner sitting in two lanes is listed.

  revocation:
    kind: revoke
    owner: sales
    mode: "live"
    schedule: "every 60 min 08:00-19:00 daily"
    summary: An opt-out, a death, a sale or a new lead pulls the owner out of mail that is staged and campaigns that are still sending.
    # The Smarter Contact half runs with the texting app's login, through its load route (the brain's
    # AGENTS_SC_LOAD_URL and AGENTS_SC_LOAD_TOKEN, the same two the text loads use). A box with
    # neither that route nor the login says so; an owner whose numbers are not all settled is tried
    # again on the next run.
    smarter_contact: true
    first_window_hours: 336     # the first run looks back two weeks, so going live catches up on what plan runs only listed
    floor_days: 14
    # 2026-11-19: Smarter Contact's do-not-contact is permanent, so only the plain do-not-contact signals
    # reach it; a sale, a Not Interested, a passed auction or a possible death still pull staged batches.
    sc_reasons: [opt_out, do_not_market, litigator, lead]

  sequence_watchdog:
    kind: watchdog
    owner: ops
    mode: "live"
    schedule: "07:20 daily"
    summary: Yesterday's sequence triggers checked against what each sequence should have produced; only failures are posted.
    # A sequence that does not fire leaves no error anywhere. The sold sequence missed about half of
    # the newest tags before anyone noticed (2026-11-12).
    window_hours: 24
    settle_minutes: 30
    expect:
      - name: Recently Sold to Sold Status
        when: {event: property.tags.added, tag: recently sold}
        then: {status: sold}
      - name: Lead Flow
        when: {event: property.tags.added, tag: leadflowrei}
        then: {status: new_lead}
      - name: Call New Lead
        when: {event: property.status.updated, to: new_lead}
        then: {assigned: true, task: true, card: true}
      - name: "[NEW] Hot Lead"
        when: {event: card.moved, column: "HOT Leads (Qualified)"}
        then: {task: true}
      - name: "[NEW] Warm Lead"
        when: {event: card.moved, column: "WARM Leads (Qualified)"}
        then: {task: true}
      - name: "[NEW] Cold Lead"
        when: {event: card.moved, column: "COLD Leads (Qualified)"}
        then: {task: true}
      - name: "[NEW] No Contact New Lead"
        when: {event: card.moved, column: "No Contact New Lead (Unqualified)"}
        then: {task: true}

  touch_audit:
    kind: audit
    owner: ops
    mode: "live"
    schedule: "07:30 daily"
    summary: Every dial and mail piece from yesterday checked against the gate; anything that should not have gone out is named.
    call_hours: "09:00-19:00"   # people call until 7pm Eastern (plan 4.6)
    repeat_dials: 3
    line_cap: 0                 # off: a caller ID line cap is a number-reputation tactic, and Ty does not want caller ID checks (2026-11-15)
    max_owners: 150

  daily_capture:
    kind: capture
    owner: ops
    mode: "live"
    schedule: "19:15 Mon-Fri"   # after calling hours end at 7pm
    summary: Each caller's day written down from the call log, dials, answers, conversations and talk time, whichever dialer was used.
    # Plan 6.2 and 6.3. A conversation is an answered call of a minute or more. The floors are the
    # newest teaching (decision D30 is yours: 150 dials a day); an alarm names what to check.
    conversation_seconds: 60
    floors: {dials: 150}
    floor_slack: 0.7            # only a day under 70% of the floor is called out
    dials_without_a_lead: 500

  full_attempt:
    kind: fullattempt
    owner: sales
    mode: "live"
    schedule: "16:30 Mon-Fri"
    summary: The owners dialed today who still have a top-tier number nobody tried, listed while there is time to finish them.
    short_by: 2
    lane: ftm                       # the afternoon text's days; on the live board, the card's column
    pipeline: ftm_pipeline
    afternoon_text: false
    sender: Emerson
    text_by: "17:30"
    reached_seconds: 60

  lead_check:
    kind: leadcheck
    owner: ops
    mode: "live"                # 2026-11-20: decision D13 answered (Emerson owns leads)
    schedule: "08:10 Mon-Fri"
    summary: Every lead checked for an open task, an assignee and a confirmed number; what is missing goes to the lead manager.
    # Plan 2.7 and 2.12. The missing task itself is created by lead_tasks five minutes earlier; this
    # check names what could not be fixed. A record that gained a list (a new lien, notice or
    # obituary) gets a same-day task for the lead manager; a new obituary marks the Correct numbers
    # Verify Number and queues the record for research, without changing its lead status.
    new_lead_hours: 24
    gate_allow: [lead]
    research_per_day: 2
    stale_tag: Verify Number
    # Decision D13 (Ty, 2026-11-20): "Emerson is a lead manager. She sets appointments for Kendrick to go walk."
    # Her user id gets the tasks. The account was brought in line the same day: the Lead Management task
    # presets and Send Back to LM assign Emerson, the Call New Lead sequence assigns her, and the 31 leads
    # Kendrick or nobody held plus Kendrick's 40 open lead tasks moved to her (output/backups/lead_owner_2026-11-20_commit.jsonl).
    lead_manager_id: "00000000-0000-0000-0000-000000000000"

  # ------------------------------------------------------------------ Atlas, Analysis
  ftm_assign:
    kind: assign
    owner: analysis
    lane: ftm
    mode: "live"
    schedule: "every 30 min 08:00-18:00 Mon-Fri"
    summary: New first-to-market records handed to a caller within 30 minutes of landing, balanced by open workload.
    presets:
      - FTM - 01 Ready to Text
      - FTM - 02 Texted, Not Yet Called
      - FTM - 00 Needs Skipped
      - FTM - 01 Skipped No Numbers
      - FTM - 02 Ready to Call
      - FTM - 03 Call Attempt 1
      - FTM - 04 Call Attempt 2
      - FTM - 05 Call Attempt 3
      - FTM - 06 Call Attempt 4
      - Probate - 01 Ready to Text
      - Probate - 02 Texted, Not Yet Called
      - Estate - 00 Needs Skipped
      - Estate - 01 Skipped No Numbers
      - Estate - 02 Ready to Call
      - Estate - 03 Call Attempt 1
      - Estate - 04 Call Attempt 2
      - Estate - 05 Call Attempt 3
      - Estate - 06 Call Attempt 4
    strategy: balanced
    caller_cap: 2000
    backlog: false
    max_per_run: 200
    routes: {}

  top1000_assign:
    kind: assign
    owner: analysis
    lane: top1000
    mode: "live"
    schedule: "every 30 min 08:15-18:15 Mon-Fri"   # after first to market, so a new notice is never behind the monthly refresh
    summary: New Top 1,000 records handed to a caller, balanced by open workload, after first to market.
    presets:
      - Priority - 00 Needs Skipped
      - Priority - 01 Skipped No Numbers
      - Priority - 01 Ready to Text
      - Priority - 02 Texted, Not Yet Called
      - Priority - 02 Ready to Call
      - Priority - 03 Call Attempt 1
      - Priority - 04 Call Attempt 2
      - Priority - 05 Call Attempt 3
      - Priority - 06 Call Attempt 4
    strategy: balanced
    caller_cap: 2000
    backlog: false
    max_per_run: 200
    routes: {}

  ftm_auction:
    kind: auction
    owner: analysis
    mode: "live"   # first live wave 2026-11-17: zero spend, no homeowner contact; acts only on a live process
    schedule: "07:45 daily"
    summary: Auction Soon kept true on every courthouse foreclosure, so the Hot Auction preset is the real hot list.
    presets: []
    scope_tags: [FTM, Courthouse Data]
    tag: Auction Soon
    soon_days: 45               # hot inside 45 days (D9): a notice lands a median 34 days before its sale
    critical_tag: Auction Critical
    critical_days: 14           # critical inside 14: the tier a priority package and a door knock key on
    # The day after the sale every channel stops (decision D39, yours). Uncomment to have the stage
    # set the status; until then it only removes the tags.
    # after_sale_status: Auction Date Passed
    # The courthouse sale date lives in the custom field. The built-in foreclosure_date on bulk
    # records is a stale public-record artifact (2022 batch defaults), so it is not trusted.
    custom_date_fields: [Foreclosure Date]
    date_fields: [auction_date, tax_auction_date]
    trust_builtin_foreclosure_date: false
    refresh_days: 3

  ftm_reactivate:
    kind: reactivate
    owner: analysis
    lane: ftm
    mode: "live"
    schedule: "Mon 08:15"
    summary: Not-interested first-to-market records whose wait is over handed back to a caller.
    presets:
      - Not Interested - FTM Foreclosure (30d)
      - Not Interested - FTM Probate (30d)
      - Not Interested - FTM rest (90d)
    every_days: 30
    max_per_run: 100

  # ------------------------------------------------------------------ Diggs, Research
  ftm_native_trace:
    kind: native_trace
    owner: research
    lane: ftm
    mode: "live"     # 2026-11-18 with the texts: a record that lands with no number gets DataSift's own (free) trace
    schedule: "every 30 min 07:00-19:00 daily"
    summary: First-to-market records that land with no trace get DataSift's own skip trace, scoped to exactly them, estimate first.
    presets: [FTM - 00 Needs Skipped, Estate - 00 Needs Skipped]
    min_age_hours: 1
    scoped: true
    every_hours: 12

  top1000_native_trace:
    kind: native_trace
    owner: research
    lane: top1000
    mode: "live"
    schedule: "every 30 min 07:15-19:15 daily"
    summary: Top 1,000 records with no trace get DataSift's own skip trace, scoped to exactly them, estimate first.
    presets: [Priority - 00 Needs Skipped]
    min_age_hours: 1
    scoped: true
    every_hours: 12

  ftm_retrace:
    kind: retrace
    owner: research
    lane: ftm
    covers: [tracerfy]
    mode: "live"
    schedule: "11:00 Mon-Fri"
    summary: First-to-market records DataSift traced with no number found, traced again with the next source nobody has tried.
    presets: [FTM - 01 Skipped No Numbers, Estate - 01 Skipped No Numbers]
    sources: [smartskip, tracerfy]
    callable_tiers: [Dial First, Dial Second]
    deceased: hold                   # 2026-11-19: a probate's representative is traced; a possible death waits for research_queue
    entity: principals
    principals_per_day: 10
    after_sources: mail_only
    mail_only_tag: Mail Only
    deep_prospect_per_day: 3
    max_records: 50
    daily_usd: 10
    agreement_tag: Two Sources
    write_tiers: [Dial First, Dial Second]
    reserve_tiers: [Dial Third]
    keep_numbers: 3
    drop_status: DEAD
    write_line_type: true
    fixup_queue: 100
    fixup_tag: Needs Fix-Up
    lookback_days: 14

  top1000_retrace:
    kind: retrace
    owner: research
    lane: top1000
    covers: [tracerfy]
    mode: "live"
    schedule: "11:20 Mon-Fri"
    summary: Top 1,000 records DataSift traced with no number found, traced again with the next source nobody has tried.
    presets: [Priority - 01 Skipped No Numbers]
    sources: [smartskip, tracerfy]
    callable_tiers: [Dial First, Dial Second]
    deceased: hold                   # 2026-11-19: a possible death waits for research_queue
    entity: principals
    principals_per_day: 10
    after_sources: mail_only
    mail_only_tag: Mail Only
    deep_prospect_per_day: 3
    max_records: 50
    daily_usd: 10
    agreement_tag: Two Sources
    write_tiers: [Dial First, Dial Second]
    reserve_tiers: [Dial Third]
    keep_numbers: 3
    drop_status: DEAD
    write_line_type: true
    fixup_queue: 100
    fixup_tag: Needs Fix-Up
    lookback_days: 14

  ftm_exhausted:
    kind: retrace
    owner: research
    lane: ftm
    covers: [tracerfy]   # the org-chart agent whose job this stage does
    mode: "live"
    schedule: "11:30 Mon-Fri"
    summary: Called through with nothing left to dial, traced with a source not yet tried, then Diggs.
    # Challenge C11.2: every number called through with no contact, or the 6-attempt maximum, means exhausted: deep prospect.
    # Since 2026-11-13 the exhausted preset starts at 5 call days, and "03b" holds the records whose
    # every number is marked wrong or dead before the round is over. Both mean nothing is left to dial.
    presets: ["03 Exhausted Call -> DP", "03b No Live Number -> DP"]
    require_tags: [FTM]
    sources: [smartskip, tracerfy]   # a source this record has already had is skipped, so the three-pass rule holds
    callable_tiers: [Dial First, Dial Second]
    deceased: hold                   # 2026-11-19: research spend stays with research_queue (foreclosures first)
    entity: principals
    after_sources: mail_only         # 2026-11-19: was deep_prospect; back to it when research widens past foreclosures
    mail_only_tag: Mail Only
    new_numbers_tag: New Numbers     # a dialed-out record that gains numbers is flagged for the callers
    deep_prospect_per_day: 3
    max_records: 25
    daily_usd: 5
    write_tiers: [Dial First, Dial Second]
    reserve_tiers: [Dial Third]
    keep_numbers: 3
    drop_status: DEAD
    write_line_type: true
    fixup_queue: 100
    fixup_tag: Needs Fix-Up

  ftm_score:
    kind: score
    owner: research
    lane: ftm
    covers: [phone]
    # LIVE 2026-11-18 with the texts: a number is texted only when it is a mobile scored Dial First or
    # Second (gate.usable_numbers), so with this stage in plan no new record could ever be texted.
    # Needs AGENTS_LIVE_STAGES to name it (Trestle is paid; daily_usd below caps it).
    mode: "live"
    schedule: "08:30 Mon-Fri"
    summary: Every unscored number on a first-to-market record in the call round tiered before the texts and the callers start.
    presets:
      - FTM - 01 Ready to Text
      - FTM - 02 Texted, Not Yet Called
      - FTM - 02 Ready to Call
      - FTM - 03 Call Attempt 1
      - FTM - 04 Call Attempt 2
      - FTM - 05 Call Attempt 3
      - FTM - 06 Call Attempt 4
      - Probate - 01 Ready to Text
      - Probate - 02 Texted, Not Yet Called
      - Estate - 02 Ready to Call
      - Estate - 03 Call Attempt 1
      - Estate - 04 Call Attempt 2
      - Estate - 05 Call Attempt 3
      - Estate - 06 Call Attempt 4
    max_records: 200
    recheck_days: 7
    daily_usd: 5
    drop_status: DEAD
    write_line_type: true

  top1000_score:
    kind: score
