      - FTM - 02 Ready to Call
      - FTM - 03 Call Attempt 1
      - FTM - 04 Call Attempt 2
      - FTM - 05 Call Attempt 3
      - FTM - 06 Call Attempt 4
      - Probate - 01 Ready to Text
      - Probate - 02 Texted, Not Yet Called
      - Estate - 02 Ready to Call
      - Estate - 03 Call Attempt 1
      - Estate - 04 Call Attempt 2
      - Estate - 05 Call Attempt 3
      - Estate - 06 Call Attempt 4
    calls: hold
    hold_unseen: false
    max_records: 60

  top1000_registry_scrub:
    kind: scrub
    owner: ops
    lane: top1000
    mode: "off"
    schedule: "08:25 Mon-Fri"
    summary: The do-not-call registry flags on the Top 1,000 text and call lane remembered and counted, so no flagged number is texted or put on a call list.
    presets:
      - Priority - 01 Ready to Text
      - Priority - 02 Texted, Not Yet Called
      - Priority - 02 Ready to Call
      - Priority - 03 Call Attempt 1
      - Priority - 04 Call Attempt 2
      - Priority - 05 Call Attempt 3
      - Priority - 06 Call Attempt 4
    calls: hold
    hold_unseen: false
    max_records: 60

  ftm_texts:
    kind: textlane
    owner: ops
    lane: ftm
    pipeline: ftm_pipeline             # on the live board each card gets the text its column stands for (Day N, text N)
    # LIVE 2026-11-18 (Ty: "a fully autonomous Smarter Contact campaign for all the new records that come in
    # every day"). Needs AGENTS_LIVE_STAGES to name it on a free box. auto_release: the stage releases its own
    # batch and the texting app loads it into Smarter Contact (autopilot/scpush.py, sms_agent/sc_load.py);
    # only what Smarter Contact loaded counts as texted.
    mode: "live"
    auto_release: true
    schedule: "08:45 Mon-Fri"       # after the board's morning pass (08:35), before the window opens at 9
    summary: First-to-market owners texted the day they land and the next two days, released on its own and loaded into Smarter Contact.
    covers: [sccampaign, texttouch]
    series: opening
    presets:
      - FTM - 01 Ready to Text
      - FTM - 02 Texted, Not Yet Called
      - FTM - 02 Ready to Call
      - FTM - 03 Call Attempt 1
      - FTM - 04 Call Attempt 2
      - Probate - 01 Ready to Text
      - Probate - 02 Texted, Not Yet Called
      - Estate - 02 Ready to Call
