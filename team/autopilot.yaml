    owner: analysis
    lane: hot_auction
    mode: "plan"
    schedule: "08:05 Mon-Fri"     # after ftm_auction (07:45) has set the tags
    summary: Hot auctions worked past the call round, closed the day after the sale, and checked once 45 days later.
    scope_tags: [FTM, Courthouse Data]
    tag: Auction Soon
    critical_days: 14
    custom_date_fields: [Foreclosure Date]
    date_fields: [auction_date, tax_auction_date]
    trust_builtin_foreclosure_date: false
    priority_package: true        # D34 (yours)
    package_value: [1, 700000]
    package_min_equity_pct: 20
    door_knock: true
    close_out: true               # D39 (yours)
    after_sale_status: Auction Date Passed
    deed_check_days: 45
    deed_check_per_run: 10
    still_owned_tag: Still Owned After Sale
    max_reads: 150

  second_chances:
    kind: secondchance
    owner: analysis
    mode: "plan"
    schedule: "08:40 Mon-Fri"
    summary: Every Not Interested record gets a task to call its Correct number again, on the clock its list sets.
    statuses: [not_interested]
    intervals: {auction: 30, probate: 45, "priority 1": 45, "priority 2": 45, code: 90, tax: 90, "priority 3": 90, other: 90}   # D23
    max_per_run: 50
    max_reads: 150

  caller_book:
    kind: callerbook
    owner: analysis
    lane: agency
    mode: "off"                   # retired 2026-11-13: Priority 1 records are the agency track now; the callers work the Priority track
    schedule: "Mon 07:30"
    summary: Each caller gets a book of new Priority 1 records on Monday morning, and nothing more until the next Monday.
    presets: [Hottest - 02 Ready to Call]
    book_size: 75                 # D5
    caller_cap: 2000              # D2 (yours)
    best_rungs: 6
    top_up: false
    dream100_list: Dream 100
    dream100_per_day: 20

  strong_native_trace:
    kind: native_trace
    owner: research
    lane: agency
    mode: "off"                   # retired 2026-11-13: Strong records are the agency track now
    schedule: "every 60 min 08:00-18:00 Mon-Fri"
    presets: [Strong - 00 Needs Skipped]
    tranche: true
    scoped: true
    min_age_hours: 1

  strong_score:
    kind: score
    owner: research
    lane: agency
    mode: "off"                   # retired 2026-11-13: Strong records are the agency track now
    schedule: "09:00 Mon-Fri"
    presets: [Strong - 02 Ready to Call, Strong - 03 Call Attempt 1, Strong - 04 Call Attempt 2, Strong - 05 Call Attempt 3, Strong - 06 Call Attempt 4]
    tranche: true
