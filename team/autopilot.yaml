  # ------------------------------------------------------------------ Phase 6: KPIs, alarms and measurement
  # Every number these stages judge against is in team/kpi.yaml (the KPI catalog); none is set here.
  # None of them contacts a homeowner. The only change to the account is deal_sources' closing fields.
  kpi_alarms:
    kind: alarms
    owner: ops
    mode: "live"
    schedule: "19:25 Mon-Fri"
    summary: The day's numbers checked against the catalog's alarms; each one is said once, with what to check first and the list to move to.
    covers: [kpi]
    ready_lists:
      - {lane: ftm, preset: FTM - 02 Ready to Call}
      - {lane: top1000, preset: Priority - 02 Ready to Call}
    trace_check:
      label: first-to-market records
      scope_tags: [FTM]
      waiting_preset: FTM - 00 Needs Skipped
      no_number_preset: FTM - 01 Skipped No Numbers
    stale_days: 4

  goal_sheet:
    kind: goals
    owner: ops
    mode: "live"
    schedule: "Mon 07:40"
    summary: The revenue goal worked back to deals, leads, conversations and dials, each marked behind, at risk or on track, with a quarterly owner review on top.
    covers: [kpi]
    # Plan 6.4. Dials, conversations and leads are judged on 30 days, contracts and deals on 90, each
    # caller on 90. The revenue goal and the average deal in team/kpi.yaml are placeholders until set.
    closed_statuses: [closed]
    contract_statuses: [under_contract]
    owner_review: quarterly        # quarterly | always | off
    max_record_reads: 40           # records opened a run to credit a new lead to its caller

  deal_sources:
    kind: dealsource
    owner: ops
    mode: "live"
    schedule: "03:10 daily"        # the night list
    summary: Each closed deal recorded with its lane, list, channel, days from first touch and three names; each month, deals by source and cost per deal.
    # Plan 6.5. The deal rows are the autopilot's own record. Live, it also fills seven custom fields
    # on the record, each only when empty: create them first (text fields), the stage names any missing.
    closed_statuses: [closed]
    contract_statuses: [under_contract]
    researched_tags: [Deep Prospected]
    list_order: [Foreclosure, Probate, Tax Sale, Tax Delinquent, Liens, Condemned, Code Violation, Eviction, Divorce, Obituary]
    write_fields: true
    fields:
      lane: Deal Lane
      list: Deal List
      channel: Deal Channel
      days: Days From First Touch
      generated_by: Lead Generated By
      carried_by: Lead Carried By
      closed_by: Deal Closed By
    fee_field: ""                  # the custom field holding what a deal paid, for the margin in the owner review
    mail_tracking_lines: {}        # "8655550140": handwritten_letter, or "" for a line every piece shares
    max_records: 25                # closings read a run
    max_lead_reads: 60             # records opened for the monthly table, to place a lead's channel

  cadence_tuner:
    kind: cadence
    owner: ops
    mode: "live"
    schedule: "1st 03:40"          # monthly, on the night list
    summary: Every sold record's last conversation set against its sale date; proposes follow-up intervals 15 days shorter where leads are being lost. It never edits anything.
    # Plan 6.6. A proposal only: the intervals in team/kpi.yaml and in DataSift are yours to change.
    sold_statuses: [sold]
    days: 120                      # sale dates this far back (the sale date lags a closing by weeks)
    auction_marks: [Foreclosure, Auction Soon]
    priority_marks: [Probate]
    max_records: 150               # sold records opened a run; one already studied is not opened again

  coaching_picks:
    kind: coachpick
    owner: ops
    mode: "live"
    schedule: "19:30 Mon-Fri"      # after the capture; weekly picks on weekly_on, a new hire's every day
    summary: The two best and two worst calls of each caller picked from the call log and queued for call coaching, daily in a new hire's first week.
    covers: [callpull]
    # Plan 6.7. It picks, it does not grade. Notes go to the owner first.
    weekly_on: Fri
    new_hires: {}                  # Name: "YYYY-MM-DD", the caller's first day
    workflow: call_coaching
    agent: ops
    outcome_hours: 24

  research_results:
    kind: researchstats
    owner: ops
    mode: "live"
    schedule: "1st 03:50"          # monthly, on the night list
    summary: Each researched record read 30 days on, was a decision maker reached, by which number, did it become a lead, against the teaching's 50 to 70 percent.
    # Plan 3.11.
    researched_tags: [Deep Prospected]
    closed_statuses: [closed]
    max_records: 60                # researched records opened a run; each is read once

  # ------------------------------------------------------------------ The research lane (plan 3.1, 3.2, 3.5 to 3.8, 3.10)
  research_queue:
    kind: researchqueue
    owner: research
    # LIVE 2026-11-18 on FORECLOSURES ONLY (Ty: "run the full deep prospecting process on just the
    # foreclosures to start ... small amounts that are active and big opportunities every time"). Needs
    # AGENTS_LIVE_STAGES to name it on a free box; the research it queues then runs live (config.task_live)
    # while a webhook or Slack ask still runs dry. The sale-ahead, sold and listed checks of
    # deep_prospect_batch run when a record is ranked and again right before it is handed over.
    # To widen later, put back: presets ["02 Obituary / Deceased", "03 Exhausted Call -> DP",
    # "03b No Live Number -> DP", "04 Return Mail -> DP", "05 Vacant -> DP", "01 No / Bad Phone"] with
    # their hints, scope_tags [Auction Soon], scope_lists [Probate, Condemned],
    # statuses [Deep Prospecting] and return_signals {statuses: [Return Mail], tags: [Return Mail,
    # Returned Mail], flag: false}; and then switch ftm_deep_prospect, ftm_return_mail and ftm_no_numbers
    # off, so the queue is the one door into research.
    # 2026-11-20 (Ty: "we probably won't be doing a ton of redemptions, but we can build a process for it"):
    # the former owners tax_sale_results tags Tax Sale Redemption are researched too, at most two a day
    # (class_daily), ranked just under a sale still ahead, the soonest deadline first. Nobody tags one until
    # that stage is live, so this reads nothing before then.
    mode: "live"
    schedule: "every 30 min 08:00-17:00 Mon-Fri"
    summary: Research works one ranked queue inside its daily budget (foreclosures with a sale ahead, and the probates being texted); each record gets the tag Research Queued and one card.
    # 2026-11-18 (Ty: "do we deep prospect them?" then "finish updating"): the probates in the texting flow
    # are researched too, by their two text presets, not the whole Probate list (about 555 older probates
    # wait for a decision on that backlog).
    presets: ["Probate - 01 Ready to Text", "Probate - 02 Texted, Not Yet Called"]
    hints: {}
    scope_tags: [Tax Sale Redemption]
    scope_lists: [Foreclosure]
    statuses: []
    # plan 1.17. A redemption window is researched the day it is tagged, even on a lien (whose list waits for exhaustion).
    research_by_list: {Condemned: arrival, Foreclosure: arrival, Probate: arrival, Liens: exhausted, "Tax Sale Redemption": arrival}
    class_daily: {tax_redemption: 2}   # paid research on a small feed: two redemption owners a day at most
    workflow: deep_prospect
    agent: research
    rate_usd: 1.21
    daily_usd: 25
    max_open: 2                   # one worker runs every task: five 8-minute research runs would hold the clock 40 minutes
    card_column: {title: Check Relatives, uuid: "00000000-0000-0000-0000-000000000000"}    # prod-account's Deep Prospecting board, read 2026-11-16 (src/siftline_columns.py)
    card_done_column: ""                                # uuid of the done column; empty leaves the card
    # The deeper pass (2026-11-15): research that comes back thin (owner status Unknown, nobody named to
    # sign, no Dial First or Second number for a living signer, an unsettled dispute between the two
    # researchers, or under two sources) is sent back ONCE with more searches, the whole family looked up
    # in the obituary index first and the referee always run. Still thin after that: the tag below, for a
    # person and the paid lookups, never a third pass. Needs the low-cost engine on the box (the Claude
    # researcher reads no depth).
    deeper: true
    thin_rules: [owner_unknown, no_decision_maker, no_number, dispute, few_sources]
    thin_min_sources: 2
    deeper_rate_usd: 2.50         # an estimate until measured
    deeper_daily_usd: 10
    deeper_max_per_run: 1
    deeper_searches: 24           # a first pass has 14
    deeper_pages: 20              # a first pass has 12
    deeper_referee: always
    person_tag: "Research Needs a Person"   # create it, and a preset that shows it, before going live

  heir_lane:
    kind: heirlane
    owner: ops
    mode: "live"             # 2026-11-20: decision D19 answered (Ty: "Emerson, be the one calling the heirs")
    schedule: "09:15 Mon-Fri"
    summary: Researched records worked one verified heir at a time by one caller, texted by name about the property, written to at the heir's own address.
    gate_allow: [heir, in_research]
    heir_caller: Emerson     # D19
    attempts_per_heir: 5
    letters_per_heir: 4
    text_system: smarter_contact
    daily_pieces: 0          # mail held until the new mailers come out (Ty, 2026-11-19); 30 again after
    daily_texts: 30

  obituary_lane:
    kind: obituary
    owner: research
    mode: "live"
    schedule: "09:40 Mon-Fri"
    summary: Obituary records held a month, one soft letter before month three, researched at three months, mailed monthly until then, matched against probate filings.
    covers: [obitcamp, obitmail]   # the org-chart agents whose job this stage does (obituary_mail retired 2026-11-13)
    daily_pieces: 0                # letters held until the new mailers come out (Ty, 2026-11-19); the tags, probate matching and caller handoffs keep running
    presets: ["Obituary - All"]
    gate_allow: [deceased]
    call_presets: ["Estate - 02 Ready to Call", "Estate - 03 Call Attempt 1", "Estate - 04 Call Attempt 2", "Estate - 05 Call Attempt 3"]
    calls: after_research
    # Ty, 2026-11-17: the estate call presets show an obituary record once its death is 30 days old. A preset
    # cannot say "a probate, or an obituary past 30 days" (its keys AND, and the app reads a date window
    # only on the include side), so they read the probate notice tag OR this one, which the lane keeps
    # current. flows.py ready is the same upkeep from the command line.
    ready_tag: "Obituary 30+ Days"
    # The estate pipeline's obituary half (Ty, 2026-11-16: probate and obituary get their own pipeline). The copy
    # takes the swipe file's heir note and follow-up shapes, held to this lane's rule: no death, no list, the street
    # named, to "The <Surname> Family". It prints as a file, never through DataSift's mail, which would print the
    # owner of record's name, and that may be the person who died.
    # Ty, 2026-11-20: no typed letters anywhere, so the monthly pieces are handwritten like the soft letter (the
    # lane's default was a typed "letter"). Every monthly copy below fits a handwritten note.
    monthly_piece: handwritten_letter
    soft_copy: "Hello, my name is {sender}, and I buy houses here in East Tennessee. I'm writing to the family at {street}. If keeping the house isn't the plan, I'd be glad to help. I can buy it as it sits, belongings and all, on whatever timeline feels right. There's no hurry at all. You can reach me at {phone}."
    monthly_copy:
      - "Hello, this is {sender}. I wrote a while back about the house at {street}. I know life gets busy, so I wanted to try once more. If selling it as it is would ever help your family, call or text {phone}. Even if you're not ready, I'm glad to answer questions."
      - "Hello from {sender}. I'm still interested in the house at {street}. Nothing needs to be fixed or cleaned out, and you can leave whatever you don't want. If the time is ever right, please call or text {phone}."
      - "Hello, {sender} here about {street}. I buy houses here in East Tennessee and can work around your family's schedule. If you'd like to talk, my number is {phone}. Please keep this letter, even if you're not ready to decide yet."

  probate_honest:
    kind: probate
    owner: analysis
    mode: "live"
    schedule: "Mon 07:40"
    summary: Probate kept honest as a list a person approves, flagged addresses by the measured split, old probates to mail only, a no called again at 45 days.
    recall: auto

  paid_lookups:
    kind: paidlookup
    owner: ops
    mode: "plan"
    schedule: "09:05 Mon-Fri"
    summary: Records every source missed and worth the money queued for the assistant's paid people search, with a weekly task.
    presets: ["01 No / Bad Phone", "03b No Live Number -> DP"]
    assistant: null          # D37

  # ------------------------------------------------------------------ The two tracks (the owner's decision, 2026-11-13)
  # Priority: first to market plus the Top 1,000, worked in-house by the stages above (lanes: [ftm,
  # top1000]). Agency: everything else in the buy box, sent once a month to the calling agency.
  # Both rank by the Dream 100 opportunity score (src/dream100_build.py), one owner one slot, from
  # one shared SiftMap sweep a month (search only, never a detail read). Neither writes in plan mode.
  # First population on purpose, without taking the stage live:
  #   python -m agents.autopilot.top1000 plan          (from src/)
  #   TOP1000_ALLOW=1 python -m agents.autopilot.top1000 apply --commit
  morning_callbacks:
    kind: callbacks
    owner: sales
    mode: "live"                  # read only: it posts the list and writes nothing, so plan mode is enough
    # Three times a day, not once (measured 2026-11-15 over 30 days of the log): about 15 owners a day
    # call in and miss us, mostly between 2 and 5pm, and 80% had no call back by 1pm the next
    # business day. Each run lists everyone still waiting since the end of the last business day.
    schedule: ["08:15 Mon-Fri", "12:30 Mon-Fri", "17:15 Mon-Fri"]
    summary: Every owner who called in and reached nobody, left a voicemail or texted in since the end of the last business day, and whom nobody has answered yet, with the house and who has it; before the dialing day, at midday and before close.
    # The lesson: "The lead manager's day starts by clearing the queue: every missed call, voicemail
    # and text message in the dialer inboxes is called back and processed before any task preset."
    max_owners: 25
    sync_calls: 60                # log pages read to bring the calls and texts copy up to date first

  lead_notes:
    kind: leadnotes
    owner: sales
    mode: "live"
    schedule: "every 30 min 08:00-20:00 Mon-Sat"
    summary: Every answered call with a lead, or a real conversation on a prospect, becomes one lead note in one format from its recording (the four pillars and the intake answers, each quoted from the call) plus the custom fields that exist; a lead moved to Hot Lead or Acquisitions gets one What we know note, so nobody asks the seller twice.
    # Plan 2.9, decision D16 (open: about 20 core answers from the call, the ones that change the offer
    # in fields, the rest in the note). C8.21: at a handoff the seller never repeats an answer. The
    # lesson: lead notes follow one trained format, tied to the four pillars (C9.17). An answer the code
    # cannot find quoted in the transcript is Unknown. About $0.003 a minute to transcribe (OpenRouter)
    # and about $0.001 a call for the notes (Claude Haiku 5.5, thinking off).
    read_fields: false            # the research gate does not use the Owner Deceased field: no extra read per record
    daily_usd: 2.00               # this stage's own day cap, about 100 calls
    min_seconds: 90               # a shorter answered call is a greeting or a voicemail
    prospect_seconds: 180         # a call this long counts on a prospect that is not a lead yet
    call_events: [owner.call.answered]   # add owner.call.received for inbound calls a person picked up
    first_days: 2                 # how far back the first run reaches
    settle_minutes: 15            # a call this fresh may not have its recording yet
    max_age_days: 7               # a call still not done after this long is closed
    max_transcriptions: 12        # a run
    max_model_calls: 12           # a run
    max_reads: 60                 # DataSift record reads a run, about two a call
    max_minutes: 30
    audio_per_min: 0.003          # estimates for the caps; what OpenRouter and Claude bill is what is booked
    extract_usd: 0.003
    max_tries: 3
    recording_grace_hours: 24     # a recording gone this soon after the call is tried again
    keep_days: 60                 # transcripts kept on the box, then deleted
    fields:                       # answer -> custom field label; only labels that exist are written
      reason: Motivation
      timeline: Timeline          # exists on prod-account
      condition: Condition
      asking_price: Asking Price
      occupancy: Occupancy
      mortgage_balance: Mortgage Balance   # the label the encumbrance stage fills too
      months_behind: Months Behind         # the label the encumbrance stage fills too
    overwrite_fields: false       # a value a person or another stage put in a field is kept; Unknown is replaced
    handoff_statuses: [Hot Lead, underwrite]   # add under_contract and push_deal for the transactions and dispo handoffs (C8.21)
    handoff_delay_minutes: 45     # so the call that made the lead hot is noted first
    handoff_wait_hours: 24
    sync: true
    sync_calls: 60                # log pages read to bring the calls copy up to date first

  lead_encumbrances:
    kind: encumbrance
    owner: sales
    mode: "live"
    schedule: "every 30 min 08:00-19:00 Mon-Sat"
    summary: When a record becomes a lead, its encumbrances are filled in from what can be checked (delinquent county tax from the Trustee's own bills, the liens our lien records put on it, the mortgage on the record), with Unknown where nothing was checked, in a note and in the intake fields that exist.
    # The lesson: "Fill the encumbrance fields: mortgage balance, months behind, back taxes (Unknown
    # until checked) and the back taxes amount, HOA, and code violation liens." Writes Tax delinquency
    # amount and a note "Encumbrances" on the record; never Total Delinquency (liens plus taxes, kept
    # by the lien records). County tax only, Knox and Blount (the Trustee sites), by street.
    gate_allow: [lead]
    lead_statuses: [new_lead, No Contact New Lead, Cold Lead, Warm Lead, Hot Lead, Ghosting Lead, follow_up, lead,
                    underwrite, under_contract, push_deal, transactions, refer_lead]
    first_window_days: 14         # how far back the first run looks for records that became leads
    max_records: 15               # new leads checked a run (a record read, its fields, up to four county requests)
    max_tries: 3                  # runs a lead waits for the county tax site before its note says Unknown
    note: true
    fields:                       # what each value fills; a label the account does not have goes in the note only
      tax: Tax delinquency amount
      mortgage_balance: Mortgage Balance
      months_behind: Months Behind
      hoa: HOA
      code_liens: Code Liens
    overwrite: [tax]              # the county's figure replaces an older one; every other field a person filled is kept

  phone_cleanup:
    kind: phonecleanup
    owner: research
    mode: "live"
    schedule: "08:05 Mon-Fri"      # after the 06:30 first-to-market pull lands probate notices, before dialing
    summary: When a probate filing names the executor, the relatives' numbers earlier research put on the owner are moved down to Dial Fourth and tagged Before Executor, so the caller reaches the one person in charge first; nothing is deleted, a number a person set is never touched, and every move can be undone.
    # C3.14: "that has to be manually done by a data manager... Scary to make mass changes like that."
    # So at most 25 records are changed a run, the first write is read back, and undo puts every tag back.
    scope_lists: [Probate, Obituary]
    scope_tags: [Deep Prospected, Heir Identified]
    pr_fields: [Personal Representative, Decision Maker]   # after the record's own personal representative
    pr_phone_fields: [Personal Representative Phone]
    hold_confidence: ["low", "none"]
    lower_tier: "Dial Fourth"
    why_tag: "Before Executor"
    keep_signers: decision_maker   # before probate opens every heir may sign; always / never
    max_reads: 150
    max_records: 25
    recheck_days: 14

  new_hire_week:
    kind: newhire
    owner: ops
    mode: "live"
    schedule: ["18:45 Mon-Fri"]    # after the calling day ends (18:00), before coaching_picks (19:30)
    summary: Every answered call a new hire made that day, transcribed and graded on the rubric of their role each evening of their first week; the notes are staged for the owner to touch up and release before the new hire sees them.
    covers: [coldcoach, lmcoach, closercoach]
    # Ty, 2026-11-15: "New-hire first week: every call graded daily, with the coaching notes coming to
    # you before the caller." Nothing reaches a new hire until a releaser types release batch N and
    # confirm N; a reply "edit N: <your version>" replaces the draft, and both are kept.
    people: []
    #   - {name: "Dana", role: caller, start: "2026-11-16", slack_user: "U0EXAMPLE1"}
    #   - {name: "Rae Example", role: lead manager, start: "2026-11-23"}   # no Slack id: the team channel
    #   name: exactly as the call log names the caller (a DataSift user's first name); uuid: optional user id
    #   role: caller, lead manager or closer (picks the rubric); start: the first day, YYYY-MM-DD
    first_week_days: 5             # business days graded every day, counted from the start
    max_calls_per_day: 25          # calls sent to be graded, per new hire per day
    daily_usd: 10                  # this stage's dollars a day, before the autopilot's and the brain's caps
    min_seconds: 15                # a shorter answered call is a greeting or a hang-up and is never sent
    catch_up_days: 1               # an evening the box missed is written up the next evening
    include_inbound: false         # true grades the new hire's answered inbound calls too
    points: 3                      # things to keep and to change per call, 1 to 3

  complete_records:
    kind: complete
    owner: research
    mode: "live"
    # Two passes a night inside the night budget (70 requests a minute, 3,800 an hour, shared by every
    # stage): a completion costs about 3 requests (read, owner update, tag), so a pass of 1,000 takes
    # about 50 minutes and the second pass picks up whatever the first left. The 1,297 people on prod-account
    # (practice run 2026-11-15) finish on the first night; with trusts switched on, about two nights.
    schedule: ["00:40 daily", "03:40 daily"]
    summary: The incomplete records owned by people completed the way the course teaches (C2.27), the person's name moved into first and last so the record turns clean, companies and anything uncertain left for a person, then DataSift's free skip trace on the ones completed.
    # Measured on prod-account 2026-11-15: 11,532 incomplete records: 7,405 companies, 2,813 trusts named for
    # people, 1,297 people (a name in the company field 739, an initial for a first name 251, life
    # estates 124, both names 116, a last name only 67). Proven on one record the same day: the owner
    # update turns it clean.
    per_run: 1000                 # raised 2026-11-20 after two clean 100-record nights (Ty: finish the people first, trusts after)
    read_cap: 1400                # full record reads a pass (a held record costs a read too)
    siftmap_cap: 500              # SiftMap reads a pass, for an initial or a missing first name (its own counter)
    trusts: "hold"                # until the owner decides; "complete" rewrites a trust named for a person to that person (C11.28)
    life_estates: "complete"      # the life tenant is the owner today (C11.28)
    trace: true                   # DataSift's own free skip trace once 20 or more are completed
    min_batch: 20

  lost_deal_audit:
    kind: lostdeals
    owner: analysis
    mode: "live"                  # read only: it writes nothing to the account in any mode
    schedule: "1st 04:20"         # monthly, on the night list, after the cadence and research reports
    summary: Every house in our account that sold last month to an investor, who bought it and what we did or missed first (never worked, worked but never reached, reached but not followed up, a lead we lost), with the repeat buyers named as possible dispo buyers.
    # C10.37 and lesson 2-06 at 2:28. The investor test is the deal-odds label's own
    # (deal_odds_train.investor_entity). DataSift refreshes last_sold about two months after a
    # closing, so the months before the audited one are read again for late arrivals.
    months_back: 1                # the month audited: 1 is the calendar month before this one
    catch_up_months: 2
    max_records: 150              # sold houses opened a run (one record read each)
    siftmap_cap: 150              # SiftMap deed reads a run (the house is in the account)
    portfolio_min: 3              # a buyer SiftMap shows owning this many properties is an investor
    nominal_floor: 10000          # under this a deed is a family or no-price transfer
    resale_months: 24             # a seller who bought within this long is an investor reselling
    gap_lines: 3                  # the channel shows six lines: the biggest gaps, the repeat buyers, the file

  neighborhood_suppression:
    kind: suppression
    owner: analysis
    mode: "live"                  # it suggests; a person applies the change file with preset_patch.py
    schedule: "1st 04:40"
    summary: Neighborhoods whose worked records keep going bad (dead leads, not interested, a bad-area tag) far more often than the account's own rate, proven by a count and written into a preset change file for you to approve; it never changes a preset.
    # C10.34. A neighborhood the presets already skip is not suggested again.
    window_days: 180
    bad_statuses: [Dead Lead, not_interested]
    bad_tags: [Bad Area]          # a caller tags a lead from a bad area; the tag does not exist yet
    min_bad: 5
    min_worked: 8
    min_lift: 0.15                # at least 15 points above the account's own bad share
    max_chance: 0.05              # and under a 1 in 20 chance at the account's rate
    read_cap: 400                 # worked records opened a run for their neighborhood, each once
    apply_to: excluding           # excluding: the presets that already skip neighborhoods; marketing: every call, mail and pre-call preset

  tax_watch:
    kind: taxwatch
    owner: analysis
    mode: "live"
    # Weekly at night, inside the night budget (70 requests a minute, 3,800 an hour, shared by every stage):
    # a record costs 2 DataSift reads (the record, its custom fields) and 2 to 5 county requests, so 300
    # take about 25 minutes. Clear of complete_records (00:40, about 50 minutes) and owner_lanes (02:30).
    schedule: "Sun 01:35"
    summary: County tax status on the records the team works (leads, hot auctions, tax sale, probate, tax delinquent, obituary, the Top 1000), read from the county Trustee's own bills and written back until paid; a record that has paid gets 0, the tag Taxes Paid and a dated note.
    covers: [tax]                 # the org-chart agent whose job this stage extends (upload-time Tax Enricher)
    statuses: [new_lead, No Contact New Lead, Cold Lead, Warm Lead, Hot Lead, Ghosting Lead, follow_up, lead, underwrite, under_contract, push_deal, transactions, refer_lead]
    urgent_tags: [Auction Critical, Auction Soon]          # read first and every week, like a lead
    scope_lists: [Tax Sale, Probate, Tax Delinquent, Obituary]
    scope_tags: [Top 1000]
    hold_tags: [Do Not Market, recently sold, Estate Sold, Wrong House]
    amount_field: Tax delinquency amount                   # never Total Delinquency (liens plus taxes); refused if named
    year_field: tax_delinquent_year                        # documented property PATCH; empty leaves the year alone
    paid_tag: Taxes Paid                                   # create it before going live
    recheck_days: 91              # a clean reading, no parcel, a held record, another county
    recheck_owing_days: 28        # a reading that owes, or bills that could not be read
    recheck_urgent_days: 7        # a lead or a hot auction
    delinquent_from: "03-01"      # a reading taken before this day is due again once it passes
    max_records: 300              # records read in full a run
    max_scan: 5000                # search rows listed per list, tag or status set
    max_minutes: 40               # one worker runs every stage
    county_pause_s: 0.5
    note: true
    alert_leads: true             # a lead that newly owes or has paid is one alert to the pipeline channel
    zero_on_blank: false          # a clean reading on a blank field leaves it blank
    individuals_only: true        # people only (2026-11-14)
    estates_are_people: true      # a person's estate counts as the person

  # ------------------------------------------------------------------ Three lead workflows (track leadprep, 2026-11-15)
  lead_property_check:
    kind: leadprep
    owner: sales
    mode: "off"                   # Ty, 2026-11-20: "We probably don't need" the Zillow lookup on new leads
    schedule: "every 10 min 08:00-18:00 Mon-Fri"
    summary: Each new lead's house looked up on Zillow before the first call, the listing in the last six months, the agent, how it ended, the last sale and a one-phrase condition from the old listing photos, written in one Property check note.
    # Rules C9.16, L14.115, L14.117, L14.122, L10.34. One OpenWebNinja details call (about $0.01) and one
    # photo read by Claude Haiku 5.5 (about a tenth of a cent) per new lead. Plan mode reads and gates and
    # spends nothing. Never SiftMap's images route (DataSift's acceptable use prohibits it).
    gate_allow: [lead]
    recheck_statuses: []          # e.g. [underwrite] checks the house again when it reaches acquisitions
    recheck_days: 90
    months_listed: 6
    per_run: 10
    per_day: 25
    max_reads: 40
    max_photos: 4
    photo_width: 768
    daily_usd: 1
    sync_calls: 60

  closer_handoff:
    kind: closertext
    owner: sales
    mode: "off"                   # Ty, 2026-11-20: "We don't need to use that handoff flow for now"
    schedule: "every 5 min 09:00-18:00 Mon-Fri"
    summary: When a lead moves to acquisitions, a short text from the closer naming the teammate the seller spoke with and saying the call comes in a few minutes, staged for a person to release; the closer is pinged in the pipeline channel.
    # Rules C5.21, C8.13, C8.21. Nothing is sent from here: a releaser types release batch N, and the texting
    # side sends the load file from the closer's own line. A text is good for an hour after the move.
    gate_allow: [lead]
    statuses: [underwrite]        # the account's Acquisitions status, exactly as stored
    columns: []                   # lead board column ids whose card move is a handoff (Send to Acquisitions sets no status)
    closer: ""                    # the closer's first name: Ty to name
    closer_line: ""               # the closer's own ten-digit number: Ty to name
    lead_manager: ""              # named when the call log names nobody (decision D13)
    talk_seconds: 60
    lookback_days: 30
    good_for_minutes: 60
    once_days: 7
    max_items: 10
    text_usd: 0.02
    system: smrtphone
    ping: true
    sync_calls: 60

  primary_phone:
    kind: primaryphone
    owner: sales
    mode: "live"
    schedule: "every 30 min 09:00-19:00 Mon-Fri"
    summary: A number a caller marks CORRECT made the owner's primary phone, so DataSift's own sequences and the dialer use the number that reaches the owner; the old primary is kept for undo.
    # Rules L14.95, L5.21. PATCH /api/internal/owner/{uuid}/ {"primary_phone": ...}. Prove it on one staging
    # record first (from src/):
    #   PRIMARY_PHONE_ALLOW=1 python -m agents.autopilot.primaryphone prove --owner <uuid> --number <+1...> --commit
    sources: []                   # empty: any writer of the mark; [kixie] acts on the dialer's marks only
    allow: [lead, not_interested]
    override_confirmed: false
    max_owners: 50
    max_reads: 120
    sync_calls: 60

  # ------------------------------------------------------------------ account checks and the business audit
  # Both read only. A finding is for a person to fix in the DataSift app: sequences live in Sequence
  # Builder, which the published API does not reach.
  account_checks:
    kind: accountchecks
    owner: ops
    mode: "live"
    schedule: "07:25 Mon-Fri"
    summary: The account's own automations read for what they get wrong (a sequence text that keeps failing, a sequence that texts records that are not leads, tasks on someone who is not a caller, tasks that do not fit their record).
    window_days: 7              # the sequence text checks read this many days of the log copy
    match_seconds: 120          # a sequence's text and the card, task or assignment the same run made land this close
    min_failures: 3             # a sequence is named once this many of its texts failed...
    fail_share: 0.5             # ...and at least this share of what it sent
    min_prospect_sends: 2       # texts to records that were not leads before a sequence is named
    overdue_bulk: 10            # one person holding this many tasks past their date is named
    stale_task_days: 30
    min_created: 20
    min_completed_share: 0.1    # tasks made and not done: named when fewer than this share were completed
    also_ok: [Kendrick]             # people besides the callers who may hold open tasks: Kendrick walks the appointments Emerson books (D13, 2026-11-20)
    prospecting_statuses: [follow_up]   # a record in one of these is still prospecting (lesson 7-07 at 2:31)
    task_fits: {}               # a task title -> the status(es) it belongs to, where the account's titles differ from the lead board's
    max_task_pages: 10          # 100 tasks a page
    max_record_reads: 60

  business_audit:
    kind: bizaudit
    owner: analysis
    mode: "live"
    schedule: "1st 07:45"
    summary: The course's quarterly business audit scored ahead of time from the account's own data; the questions only the owner can answer are listed for him.
    # The scheduler has no quarterly slot: the stage runs on the 1st and audits only a period it has
    # not audited yet. An ask from Slack always answers.
    every_months: 3             # quarterly; 1 while starting out (C13.59)
    window_days: 91
    max_data_score: 4           # a true 5 is rare: the data never claims one, the owner can
    answers: {}                 # the owner's own 1 to 5 by question id (M1 to K5); an answer also overrides the data
    labels: {}                  # K5's wording, from the audit sheet the Day 5 workbook links to
    ni_follow_days: 30          # a Not Interested owner is due a call back after this long
    note_hours: 24              # a note this long after a conversation documents it
    max_record_reads: 30        # per question that joins records to owners

  tax_sale_results:
    kind: taxsale
    owner: analysis
    mode: "live"                        # 2026-11-20, Ty: "we can build a process for it". Tags, notes and research only; the gate's research_tags hold every contact
    schedule: "07:50 Mon-Fri"           # before research_queue's first slot (08:00)
    summary: The Knox tax sale results read row by row; every former owner who can still redeem tagged Tax Sale Redemption for the research queue with the deadline on the record, the winning bidders added to the buyer registry as cash buyers.
    # Tenn. Code Ann. 67-5-2701: the right to redeem runs from the court's order confirming the sale. The
    # period the Trustee prints on a row wins over the statute. Buying a redemption right runs into the
    # anti-profiteering rule in 67-5-2701(b)(2): every note says to check with a lawyer first. The tag holds
    # the owner out of every outreach channel (gate.research_tags) while research takes it (research_queue).
    read_fields: false
    # This box reads the Trustee's page itself at the start of every run (knox_tax_sale.capture). Read live
    # from a workstation 2026-11-20: a static site on Amazon S3 behind CloudFront, plain requests served, the
    # PDFs too. The first-to-market box's Fly address got a 403 from knoxcounty.org the same day (the menu's
    # forms live there; they are no longer fetched), so a refused request is tried again from a residential
    # address through Scrapfly (SCRAPFLY_KEY, about 25 credits a fetch), as that box does; the run says how
    # many went that way. A page neither way can read is a problem in #issues.
    fetch: true
    fetch_via: residential
    page: ""                            # default: the Trustee's tax sale page (KNOX_TAX_SALE_PAGE)
    archive_dir: ""                     # default /data/knox: tax_sale_docs.json and tax_sale_archive/, kept by the fetch above
    county: Knox
    tag: Tax Sale Redemption
    note: true
    period_rule: "shorter"
    # The date the Chancery Court entered the order confirming each sale; the window starts there. Tax Sale 25
    # (Docket No. 210628-3, sold June 2, 2026): "Decree Confirming Sale", posted on the Trustee's tax sale page
    # (trustee.knoxcounty.org/assets/pdfs/TaxSale25-DecreeConfirmingSale.pdf), stamped ENTERED JUN 30 2026 and
    # signed by the Chancellor "ENTERED this 30th day of June 2026"; read 2026-11-20. The decree is a scanned
    # image: the stage asks for the next sale's date when the Trustee posts its decree.
    confirmed: {"2026-06-02": "2026-06-30"}
    # The results PDF prints no sale date. The page announces it ("Tax Sale 25 ... Event Details: June 2nd,
    # 2026", read 2026-11-20), and the fetch keeps that date on each document; this line is the fallback.
    sale_dates: {"TaxSale25-FiNAL_RESULTS_PDF.pdf": "2026-06-02"}
    scales:
      - {from: "2026-07-01", steps: [[3, "12 months"]], over: "90 days"}                     # Public Chapter 971 (2026)
      - {from: "1900-01-01", steps: [[5, "12 months"], [7, "180 days"]], over: "90 days"}    # 67-5-2701(a)(1)(B)
    min_days_left: 5
    max_records: 40
    recheck_days: 7
    roll_check: true
    max_roll_lookups: 20
    buyers: true
    registry_dir: ""
    government_bidders: [Knox County, City of Knoxville, State of Tennessee]

  agency_scorecard:
    kind: agencyscore
    owner: ops
    mode: "live"
    schedule: "8th 08:10"          # monthly: the agency reports a finished month in its first week
    summary: What the calling agency sent back last month against what it was sent (leads, no's, wrong numbers, removals, cost per lead) beside the in-house lanes over the same month, and what to ask the agency for when only its PDF came back.
    month: last                    # last, this, or YYYY-MM
    monthly_fee: 0                 # the agency's fee a month; 0 until the owner sets it
    inhouse_monthly_cost: 0        # what the in-house lanes cost a month; 0 until set
    ask: ""                        # empty uses the workflow's default words (AGENTS_AGENCY_RESULTS_ASK)
    lead_months: 3                 # agency leads this many months back are followed to contracts
    sales_test_min_leads: 10       # C13.18: this many agency leads and no contract this month reads as a sales problem
    contract_statuses: [under_contract]
    closed_statuses: [closed]
    appointment_kind: appointment
    sync: true                     # refresh the log copy (calls, state, board) first
    max_log_calls: 150

  contact_rate:
    kind: contactrate
    owner: ops
    mode: "live"                  # read only: the report is the same in plan and live mode
    schedule: "09:10 Mon"
    summary: Of the owners first worked each week (first dialed or texted), how many we have reached since (a conversation of a minute or more, a text reply, or a number marked correct), the last six complete weeks overall and by lane, the way a friend's Contact Rate Bot reports it.
    # Ty, 2026-11-16: "for the records that are actively being marketed to or signed out. Probably a better
    # way to think about it." Each week is a cohort, counted once and cumulatively. First read on prod-account
    # (weeks 41 to 46): 248 of 4,109 owners first worked were reached (6.0%).
    weeks: 6
    cohort: worked                # worked: first dialed or texted that week; signed_out: first assigned to a person that week
    count_correct: true           # a number marked CORRECT counts as reached (a short "yes it's me" is a contact)

  kpi_tracker:
    kind: kpitracker
    owner: ops
    mode: "live"                  # read only: the snapshot is the same in plan and live mode
    schedule: ["07:45 Mon-Fri", "12:30 Mon-Fri", "19:30 Mon-Fri"]   # 19:30 runs after daily_capture (19:15) and kpi_alarms (19:25)
    summary: One snapshot of the operations numbers three times a weekday (calls, leads, deals, the county board, direct mail, channels, lists, goals and costs), published as the brain's own tracker page with one CSV per tab that any Google Sheet mirrors with IMPORTDATA, and one Slack message a day edited in place.
    covers: [kpi]
    # Ty, 2026-11-16: mirror how the DataSift KPI tracker works, "as core and as simple for any universal users
    # to run as we possibly can", no Lambda or AWS. kpisinks.py publishes; a Google credential is optional.
    run: auto                     # the first slot is the morning, the last the evening
    sync: true
    groups: [calls, state, texts, board]
    max_log_calls: 400
    max_counts: 60
    max_lead_rows: 2000
    months: 6
    weeks: 6
    caller_days: 20
    lead_days: 5
    ledger_rows: 200
    qualified_statuses: [Hot Lead, Warm Lead, Cold Lead]   # F9
    contract_statuses: [under_contract]
    closed_statuses: [closed]
    lost_statuses: [lost_deal, Dead Lead, not_interested]
    pipeline_stages: [top1000_attempts]
    feeds: [Foreclosure, Probate, Liens, Condemned, Obituary]
    not_callers: []               # F15
    ledger_streets: false         # F4: record links only
    tab_runs:
      Direct Mail: [morning, evening]
      Lists: [morning]
      Costs: [morning]
    publish:
      title: "KPI tracker"
      slack: "edit"               # one message a day, edited in place; posts or off
      how_tab: "How it is counted"

  auction_mail:
    kind: mailcadence
    owner: ops
    lane: ftm
    mode: "plan"                  # held until the new mailers come out (Ty, 2026-11-19)
    schedule: "09:45 Mon-Fri"
    summary: Foreclosure records with a sale date, mailed weekly on a countdown from that date and staged for a person to release.
    # SPEC 6.3 and 7 (2026-11-16). Timed by the day a piece lands; nothing lands later than 2 days before the sale.
    # Ty, 2026-11-16 (from the swipe file's pre-foreclosure lane): one piece lands every week until the sale.
    anchor: sale_date
    vendor: siftmail
    internal_routes: true
    send: staged
    scope: {lists: [Foreclosure], tags: [FTM]}
    clock:
      anchor_field: Foreclosure Date        # custom field, YYYY-MM-DD; read, never printed
      first: on_entry
      gap_days: 7                           # the weekly hit (was 6, tightening to 3 in the last 10 days)
      final_window_days: 10
      final_gap_days: 7                     # weekly to the end; also the auction lane's minimum gap between pieces
      latest_in_home_days_before: 2
      lead_calendar_days: 7                 # 2 business days to the send date, 3 to deliver
      delivery_days: 3
      max_pieces: 6
      # the postcard (A4) before the check (A3), so no format follows itself: handwritten, Snap Pack, postcard,
      # Snap Pack, handwritten, Snap Pack with all six; the middle drops from the end when time is short
      fill: {first: A1, last: [A5, A6], middle: [A2, A4, A3]}
      postponed: retime                     # pieces left re-timed; the closing pair at most once more
      after_sale: {grace_days: 14, hand_to: ftm_mail, start_at_step: 2}
      refresh_days: 1                       # the sale date is read again daily, so a postponement is seen the next morning
    min_batch: 1                            # Ty, 2026-11-16: "we can absolutely do Sift Mail with any count"
    daily_pieces: 50
    daily_usd: 40
    prices: {handwritten_letter: 1.89, snap_pack: 1.15, postcard: 0.74}
    # Three formats only (Ty, 2026-11-20): the Real Penned note (16), the Snap Pack (18, First-Class, so the
    # countdown's 3 delivery days hold) and the 6x9 postcard (14). Anything about the sale date rides sealed: the
    # options letter (A2) and the last note (A6) are Snap Pack letters, the offer (A3) is the Snap Pack check with no
    # amount in the live-check style (DataSift's own check letter rebuilt on the Snap Pack, Ty 2026-11-20), "the date
    # is close" (A5) is a handwritten note. A piece with design_noname goes out named only where SiftMail would print
    # a clean first name (mail.is_named).
    pieces:
      - {id: A1, piece: handwritten_letter, product_id: 16, envelope: 16, design: "00000000-0000-0000-0000-000000000000", external_identifier: "", design_noname: "00000000-0000-0000-0000-000000000000", external_identifier_noname: ""}
      - {id: A2, piece: snap_pack,          product_id: 18, design: "00000000-0000-0000-0000-000000000000", external_identifier: ""}   # AUC A2 Snap options
      - {id: A3, piece: snap_pack,          product_id: 18, design: "00000000-0000-0000-0000-000000000000", external_identifier: "", design_noname: "00000000-0000-0000-0000-000000000000", external_identifier_noname: ""}   # SNP Live check v6, shared with the evergreen step 3
      - {id: A4, piece: postcard,           product_id: 14, design: "00000000-0000-0000-0000-000000000000", external_identifier: "", street_view: true}
      - {id: A5, piece: handwritten_letter, product_id: 16, envelope: 17, design: "00000000-0000-0000-0000-000000000000", external_identifier: "", design_noname: "00000000-0000-0000-0000-000000000000", external_identifier_noname: ""}   # AUC A5 The date is close, navy envelope
      - {id: A6, piece: snap_pack,          product_id: 18, design: "00000000-0000-0000-0000-000000000000", external_identifier: ""}   # AUC A6 Snap last note
    sender: {}

  probate_mail:
    kind: mailcadence
    owner: ops
    lane: ftm
    mode: "plan"                  # held until the new mailers come out (Ty, 2026-11-19)
    schedule: "10:15 Mon-Fri"
    summary: Personal representatives of confirmed decedent houses, from the week the estate opens to month 24, staged for a person to release.
    # SPEC 6.4 and 7 (2026-11-16). Never two pieces closer than 14 days; confirmed houses only.
    anchor: filed_date
    vendor: siftmail
    internal_routes: true
    send: staged
    scope: {lists: [Probate], tags: [FTM], not_tags: [Wrong House, Estate Sold]}
    require: decedent_house                 # the probate stage's audit split, or the upload owner guard after 11-11
    clock:
      anchor_field: Probate Open Date       # read, never printed; then the notice month tag, then Date Added
      min_gap_days: 14
      steps:                                # in-home targets
        - {piece: PB1, at: on_entry}
        - {piece: PB2, after_days: 14}
        - {piece: PB3, after_days: 14}
        - {piece: PB4, after_days: 30}
        - {piece: PB5, after_days: 30}
        - {piece: PB6, after_days: 30}
        - {piece: PB7, after_days: 30}
        - {piece: PB10, after_days: 30}
        - {piece: PB8, after_days: 30}
        - {piece: PB9, after_days: 30}
        - {piece: PB4, after_days: 30}
        - {piece: PB8, after_days: 30}
        - {piece: PB9, after_days: 30}
        - {piece: PB10, after_days: 30}
      after_month_12: {every_days: 75, rotate: [PB4, PB8, PB10, PB9], until_month: 24}
    min_batch: 1                            # Ty, 2026-11-16: SiftMail takes any count
    daily_pieces: 50
    daily_usd: 40
    prices: {snap_pack: 1.15, handwritten_letter: 1.89, postcard: 0.74, family_postcard: 0.74}
    # Three formats only (Ty, 2026-11-20). Every typed letter to the personal representative is now a sealed Snap
    # Pack letter with a keep-this card where the check would be: no check on an estate piece (the swipe file's
    # rule). The handwritten notes go named only where SiftMail would print a clean first name (mail.is_named),
    # the "Hi there," twin to everyone else. Same order as before, so no format follows itself.
    pieces:
      - {id: PB1, piece: snap_pack,          product_id: 18, design: "00000000-0000-0000-0000-000000000000", external_identifier: ""}   # PRB PB1 Snap first letter
      - {id: PB2, piece: handwritten_letter, product_id: 16, envelope: 16, design: "00000000-0000-0000-0000-000000000000", external_identifier: "", design_noname: "00000000-0000-0000-0000-000000000000", external_identifier_noname: ""}
      - {id: PB3, piece: snap_pack,          product_id: 18, design: "00000000-0000-0000-0000-000000000000", external_identifier: ""}   # PRB PB3 Snap options
      - {id: PB5, piece: snap_pack,          product_id: 18, design: "00000000-0000-0000-0000-000000000000", external_identifier: ""}   # PRB PB5 Snap creditor window
      - {id: PB6, piece: handwritten_letter, product_id: 16, envelope: 17, design: "00000000-0000-0000-0000-000000000000", external_identifier: "", design_noname: "00000000-0000-0000-0000-000000000000", external_identifier_noname: ""}
      - {id: PB7, piece: snap_pack,          product_id: 18, design: "00000000-0000-0000-0000-000000000000", external_identifier: ""}   # PRB PB7 Snap how a sale works
      - {id: PB8, piece: handwritten_letter, product_id: 16, envelope: 16, design: "00000000-0000-0000-0000-000000000000", external_identifier: "", design_noname: "00000000-0000-0000-0000-000000000000", external_identifier_noname: ""}
      - {id: PB9, piece: snap_pack,          product_id: 18, design: "00000000-0000-0000-0000-000000000000", external_identifier: ""}   # PRB PB9 Snap check-in
      # the estate pipeline's own soft postcards (Ty, 2026-11-16: probate and obituary get their own pipeline,
      # so the evergreen cards no longer stand in here)
      - {id: PB4,  piece: postcard,        product_id: 14, design: "00000000-0000-0000-0000-000000000000", external_identifier: "", street_view: true}
      - {id: PB10, piece: family_postcard, product_id: 14, design: "00000000-0000-0000-0000-000000000000", external_identifier: "", street_view: true}
    sender: {}

  # ------------------------------------------------------------------ call review (track callreview, 2026-11-15)
  attempt_log:
    kind: attemptlog
    owner: sales
    mode: "live"
    schedule: "every 15 min 08:00-19:30 Mon-Sat"
    summary: After every call to a lead, one dated line (the attempt number and what happened) on ONE pinned running note on the owner's message board, written from the call log, so nobody types "no answer, left vm" by hand.
    # Measured 2026-10-16 to 11-15 on prod-account: 165 notes typed by hand saying only "no answer" or "left vm"
    # (about 13 a business day, 12 to 30 s after the dial), one running note per lead pinned (45 pins)
    # and added to (29 of 55 edits). Free. Never two pinned notes on one lead. Prove the owner board on a
    # test record first: python src/agents/autopilot/proofs.py run --key-env STAGING_DATASIFT_KEY --record <uuid> --only owner_board_note --commit
    gate_allow: [not_interested]   # the call that ended a lead is logged, though the dialer marked it Not Interested seconds later
    read_fields: false            # a note contacts nobody: no Owner Deceased field read per record
    statuses: [new_lead, No Contact New Lead, Cold Lead, Warm Lead, Hot Lead, Ghosting Lead, follow_up, lead,
               underwrite, under_contract, push_deal, transactions, refer_lead]
    settle_minutes: 10
    first_hours: 24
    lead_grace_minutes: 30        # a dial this soon before the record became a lead made it one: attempt 1
    transcript_seconds: 90        # an answered call this long waits for lead notes' transcript
    transcript_wait_minutes: 120  # then the line says "answered" and the length
    disposition_minutes: 30
    pair_minutes: 10
    max_owners: 20
    max_reads: 80
    board_page: 50
    max_records: 2
    note_max: 3900                # a longer log continues in a new note; the old one is unpinned first
    caller_names: true
    sync: true
    sync_calls: 40

  call_screen:
    kind: callscreen
    owner: ops
    mode: "live"
    schedule: ["19:45 Mon-Fri"]   # after the daily capture (19:15) and the coaching picks (19:30)
    summary: Each evening every answered call of a minute or more is read for a price given on the phone, a soft yes nothing followed, a Not Interested or Dead Lead with no real refusal, and, on a lead that went quiet or a contract that fell apart, the objection nobody asked about; every flag quotes the call, and the owner reads them first.
    # C9.39, C8.12, C9.37 with L10.37 and L10.38, A13.1. Claude Haiku 5.5, thinking off: well under a
    # tenth of a cent a call; a transcript nobody kept costs about $0.003 a minute (OpenRouter).
    daily_usd: 0.50
    min_seconds: 60
    call_events: [owner.call.answered, owner.call.received]
    first_hours: 24
    settle_minutes: 120           # a call this fresh is screened the next evening: its soft yes gets time for a follow-up
    max_age_days: 7
    max_calls: 60
    max_reads: 120
    transcribe: true
    max_transcriptions: 8
    max_minutes: 30
    audio_per_min: 0.003
    screen_usd: 0.002
    min_quote_words: 3
    disposition_hours: 12
    no_statuses: [not_interested, Dead Lead]
    quiet_statuses: [Ghosting Lead]
    lost_statuses: [lost_deal]
    contract_statuses: [under_contract, transactions]
    closed_statuses: [closed, close_out, sold]
    quiet_calls: 2
    quiet_days: 45
    follow_up_task: true          # 2026-11-20: D13 answered; the leads and their tasks are Emerson's now
    task_due_days: 1
    sync: true
    sync_calls: 60

  top1000_refresh:
    kind: top1000
    owner: analysis
    lane: top1000
    mode: "live"
    schedule: ["1st 00:20", "1st 03:20", "2nd 00:20", "3rd 00:20"]   # monthly; the later slots only finish what the first could not
    summary: The Top 1,000 owners re-ranked once a month on deal odds (the chance an investor buys one of their houses within six months, learned from what sold), one owner one slot; who would gain and lose the tag is listed, with the ranking as a file.
    # Ranked on deal odds since 2026-11-14 (src/deal_odds.py, fitted by src/deal_odds_train.py):
    # tested on the half-year after its training window, its top 1,000 houses held 17 of 574 investor
    # deals, against 10 for the old Dream score's core and 4 for the Priority 1 combinations.
    # score: dream100 puts the old points back for comparison.
    score: deal_odds
    min_room: 15000               # a house with under $15,000 of discount room has no room for a fee
    individuals_only: true        # people only, no companies or trusts (the owner's rule, 2026-11-14); the agency file inherits it
    # The pool: the agency track's own rows (owner and status of each house), plus the records that
    # hold the tag now and the records on the Agency list, so a house sent last month can still be
    # promoted. If the parallel preset build splits the queue in two, list both titles here.
    presets: [Agency - 01 Queue]
    pool_lists: [Agency]
    counties:
      - {fips: "47093", name: Knox, state: TN}
      - {fips: "47009", name: Blount, state: TN}
    size: 1000                    # owners, not houses: a selected owner gets the tag on every house in the buy box
    tag: Top 1000
    finalists: 1.5                # 1,500 owners read in full for their phones (reach) and the full gate
    keep_in_round: true           # a holder that falls out keeps the tag until its round ends
    exclude_lists: [Obituary]     # the obituary lane and its research have these owners; the Priority presets do not exclude them
    # Always in, whatever the rank (Ty, 2026-11-17: condemned, code violation and eviction records go in the
    # Top 1,000 "no matter what"; first tagged by hand in ledger run forcetopbc8fd2). An owner with a house on
    # one of these takes a slot before the ranking fills the rest. Rank, the buy box, the room floor and the
    # people-only rule do not apply to that house; the hard holds do (a higher lane such as first to market or
    # a live lead, sold, a finished status such as Not Interested, Do Not Market, a litigator, an opt-out, a
    # possible death, research, listed, not single family). Titles as the account holds them (read 2026-11-19).
    # 2026-11-20 (Ty): every county feed goes through the Smarter Contact flow on the Top 1,000, and the 1,000
    # "doesn't have to be perfectly" 1,000: the county lists below are always in, ON TOP of the ranked 1,000
    # (always_on_top), and people only, as everywhere else (always_people_only). The lists are the ones the
    # first-to-market box uploads to (src/ftm_feeds.py); top1000_feeds tags each day's arrivals the same morning.
    always_include:
      lists: [Condemned, Eviction, Code Violation, Tax Sale, Tax Delinquent Notice, Substitute Trustee, Public Sale, Court Order]
      tags: [code_violation]
    always_on_top: true
    always_people_only: true
    weights: today                # the Dream 100 weight set (D31): today or taught
    read_fields: false            # the gate's custom-field read is one more request per finalist; the in-house stages read it when they act
    max_reads: 1500               # records opened a run (remembered facts_days, so a stopped run continues)
    max_writes: 2500              # tag changes a run
    max_searches: 900             # SiftMap searches a run (its own request counter), 100 rows each
    page_size: 100                # SiftMap's fair use asks for pages of 25 to 100
    facts_days: 5
    d4d_cohort: ""                # the D4D cohort file on the box; empty looks in DATA_DIR/d4d/cohort.json

  top1000_feeds:
    kind: top1000
    job: include
    owner: analysis
    lane: top1000
    mode: "live"
    # Ty, 2026-11-20: "make sure that the county feeds are all getting sent through the smarter contact flow".
    # Each morning after the first-to-market box's 06:30 pull, the county records that landed since are tagged
    # Top 1000 (only additions, never a removal), so the death screen, the score and the 08:55 Top 1,000 texts
    # take them the same day. The lists come from top1000_refresh's always_include with its hard holds and its
    # people-only rule. Liens are a backlog of about 3,000 that the monthly ranking already ranks, so only the
    # NEW lien records (a pulled_<date> tag from the last 30 days) come in here.
    # The evening slot drains a backlog on the night request budget (the first runs meet about 500 recent liens).
    schedule: ["07:35 daily", "21:35 daily"]
    summary: Each morning the county records that arrived since yesterday (condemned, evictions, code violations, tax sale and tax delinquent notices, substitute trustee appointments, new liens) put in the Top 1,000 for its Smarter Contact texts.
    presets: [Agency - 01 Queue]  # unused by this job (the kind's monthly run reads it); kept so the block parses the same
    include_from: top1000_refresh
    recent_lists: [Liens]
    recent_days: 30
    include_reads: 150
    include_recheck_days: 14

  agency_export:
    kind: agencyexport
    owner: ops
    lane: agency
    mode: "live"
    schedule: "every 60 min 00:00-05:00 daily"   # the month's file from the 1st once the Top 1,000 is done; other nights only mark a sent file
    summary: The month's file for the calling agency, the top 5,000 owners not sent in 90 days in the format the agency already maps, staged for a person to send.
    presets: [Agency - 01 Queue]  # the agency track; if the parallel preset build splits it in two, list both titles here
    counties:
      - {fips: "47093", name: Knox, state: TN}
      - {fips: "47009", name: Blount, state: TN}
    size: 5000                    # owners in the file
    resend_days: 90               # an owner is not sent again sooner than this (enforced here: a preset cannot filter the date field)
    exclude_lists: [Obituary]     # owners the obituary lane works are not sent to the agency
    margin: 0.10                  # owners read past the size, so the file fills after the ones the agency cannot dial
    list: Agency                  # a sent record goes on this list
    field: Sent to Agency         # and this custom date field is set to the day the file was sent
    list_name: Agency call list   # the file's name and its Read me title
    about: "The agency track: owners in the buy box who are not first to market and not in the Top 1,000, highest Dream 100 score first."
    after_stage: top1000_refresh  # the file waits for this month's Top 1,000
    read_fields: false
    max_reads: 2500               # records opened a run (every house of a candidate owner, remembered facts_days)
    max_writes: 1200              # records marked a run from a sent file (two writes each)
    release_writes: 100           # records marked inside the release itself; the night runs mark the rest
    release_reads: 400            # records read again at release (only the ones whose log changed since staging)
    max_field_reads: 300          # Agency-list records with no send date the autopilot knows, read a run
    plan_harvest: true            # a plan reads the records too, so the file can be looked at before going live
    registry_numbers: hold        # read only while gate.registry_flag is true (it is false here, so flagged numbers go in the file); send = keep them either way
    max_searches: 900
    page_size: 100
    facts_days: 5

  # ------------------------------------------------------------------ cold email (src/cold_email), off Ty's PC (2026-11-20)
  # The four jobs that ran as Windows scheduled tasks ("SiftStack Cold Email Replies/Top-up/Health/Stats")
  # run here. ONE install runs them: each acts only where the state folder's home.json names this install
  # (src/cold_email/coldstate.py), so deploying this changes nothing until the cutover
  # (deploy/cold_email_cutover.py) stops the PC's tasks, copies the state to /data/cold_email and names
  # this box the home, in one step. The campaign sends Mon-Fri 9 to 5 Eastern from Instantly itself.
  cold_email_replies:
    kind: coldreplies
    owner: sales
    mode: "live"                  # free: reads Instantly, classifies, blocks, notes; hand raises to the text leads channel
    schedule: "every 5 min"       # as the PC ran it; a pass with nothing new posts nothing
    # On the people lane (store.FAST_LANE): a hand raise says "call within 5 minutes", so the pass must
    # not wait behind a twenty-minute stage run on the schedule lane. A pass takes seconds.
    fast_lane: true
    summary: Every five minutes the cold email replies are read and acted on, the same way a text reply is judged; a hand raise goes to the text leads channel for a call within five minutes, a stop reaches Instantly's block list and the DNC list, and every reply leaves a note on its record.

  cold_email_topup:
    kind: coldtopup
    owner: ops
    mode: "live"                  # outreach: acts on a free box only once its id is in AGENTS_LIVE_STAGES; plans until then
    schedule: "20:15 daily"
    summary: Each night, when fewer than three sending days of checked leads are queued, the next cold email list is built from the agency queue (the same gate as every channel, one named email per owner, ZeroBounce with Verify+) and loaded into the campaign.
    campaign: "Agency queue email 1"
    preset: "Agency - 01 Queue"
    days_queued: 3                # sending days kept queued
    min_batch: 100                # a top-up smaller than this waits for tomorrow
    build_timeout_min: 120        # a build still going after this is stopped; the next night resumes it

  cold_email_health:
    kind: coldhealth
    owner: ops
    mode: "live"                  # read only: posts only when something is wrong
    schedule: "08:00 Mon-Fri"
    summary: Each weekday morning the inboxes, their warmup, the week's bounces, the campaign, the leads left to send and the reply watcher are checked; a healthy morning says nothing.
    campaign: "Agency queue email 1"

  cold_email_stats:
    kind: coldstats
    owner: ops
    mode: "live"                  # read only: the report is the same in plan and live mode
    schedule: "09:05 Mon"
    summary: Each Monday, last week's cold email numbers (sent, replies, hand raises, bounces, stops) and the leads and ZeroBounce credits left.
    campaign: "Agency queue email 1"
